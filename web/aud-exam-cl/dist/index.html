g estimates?","o":["To identify errors in prior-period financial statements that must be restated.","To help identify and assess risks of material misstatement in the current period, including indicators of possible management bias.","To determine whether management should be replaced.","To substitute for substantive testing of current-year estimates."],"c":1,"r":["Differences between estimates and outcomes do not necessarily mean the prior statements were misstated.","Correct. AU-C 540 (and AU-C 240 for bias) use the retrospective review to inform the current-period risk assessment and to identify possible management bias. It is not intended to second-guess prior judgments made on available information.","Assessing management personnel is not an objective of this review.","It informs risk assessment. It does not replace current-period testing."],"ref":"AU-C 540.14; AU-C 240.32"},{"a":3,"q":"An auditor uses audit data analytics to analyze 100% of journal entries posted during the year, filtering for entries posted on weekends, by users without posting authority, and with round-dollar amounts just below approval thresholds. This procedure is primarily a response to:","o":["The risk of management override of controls.","Inherent risk related to the completeness of accounts payable.","The risk of incorrect rejection in sampling.","The going-concern assessment."],"c":0,"r":["Correct. AU-C 240 requires testing journal entries for evidence of management override. Data analytics allows the auditor to test entire populations against fraud-risk criteria such as unusual timing, unauthorized users, and amounts just below thresholds.","The procedure targets fraud characteristics of entries, not completeness of payables specifically.","Testing the full population eliminates sampling risk for the characteristics examined.","Journal entry analytics are not a going-concern procedure."],"ref":"AU-C 240.32; AICPA Guide to Audit Data Analytics"},{"a":4,"q":"After evaluating management's plans, the auditor concludes that substantial doubt about Garnet Co.'s ability to continue as a going concern remains. The financial statements include adequate disclosure. Which reporting is required?","o":["A qualified opinion.","An unmodified opinion and a separate section with the heading “Substantial Doubt About the Entity's Ability to Continue as a Going Concern.”","An unmodified opinion with no reference to going concern because the disclosure is adequate.","A disclaimer of opinion."],"c":1,"r":["A qualified opinion applies only if the going-concern disclosure is inadequate (a misstatement).","Correct. Under AU-C 570 (as amended by SAS 134), when substantial doubt remains and disclosure is adequate, the auditor includes a separate section with that heading, drawing attention to the note.","When substantial doubt remains, the separate going-concern section is required.","A disclaimer may be considered only in rare cases with multiple uncertainties. It is not the required response here."],"ref":"AU-C 570.24"},{"a":4,"q":"In an accountant's review report issued under SSARS on financial statements that are free of material misstatement, the conclusion states that the accountant:","o":["Expresses an opinion that the financial statements present fairly, in all material respects…","Is not aware of any material modifications that should be made to the financial statements in order for them to be in accordance with the applicable financial reporting framework.","Does not express an opinion, a conclusion, or provide any form of assurance.","Has performed procedures agreed to by management and reports the findings."],"c":1,"r":["Positive opinion language is used only in audits (and examinations).","Correct. A review provides limited assurance, expressed as a conclusion that the accountant is not aware of any material modifications needed (AR-C 90).","This disclaimer language belongs in compilation reports.","Reporting findings describes an agreed-upon procedures engagement."],"ref":"AR-C 90.39"},{"a":1,"q":"After the audit fieldwork concludes, the CEO of an attest client gives the engagement senior a luxury watch worth $3,500 to thank her for her hard work. Under the AICPA Code:","o":["Independence is not impaired because the gift was given after fieldwork.","Independence is impaired unless the value of the gift is clearly insignificant to the recipient; a $3,500 watch would generally not meet that threshold.","Independence is impaired only if the gift exceeds $5,000.","Independence is not impaired if the senior reports the gift to the engagement partner."],"c":1,"r":["The timing of the gift does not change the analysis.","Correct. For attest clients, accepting a gift other than one that is clearly insignificant to the recipient is considered to impair independence (ET 1.285.010). A $3,500 watch is not clearly insignificant.","The Code does not set a dollar safe harbor.","Reporting the gift does not cure the impairment."],"ref":"ET 1.285.010"},{"a":1,"q":"Under the AICPA Code, in which situation may a member disclose confidential client information <b>without</b> the client's consent?","o":["To a prospective buyer of the member's practice who asks to review client files before signing any agreement.","In response to a validly issued and enforceable subpoena or summons.","To a lender who asks for the client's latest financial results.","To another client in the same industry for benchmarking."],"c":1,"r":["A prospective buyer may review files only if the buyer agrees to keep the information confidential, and consent is still generally required for disclosure.","Correct. The Confidential Client Information Rule (ET 1.700.001) does not prohibit compliance with a validly issued and enforceable subpoena or summons, cooperation with peer reviews, or ethics investigations.","Disclosure to a lender requires client consent.","Sharing client information with other clients violates confidentiality."],"ref":"ET 1.700.001"},{"a":1,"q":"A CPA firm that performs audits of nonissuers and is enrolled in the AICPA Peer Review Program must ordinarily undergo which type of peer review, and how often?","o":["An engagement review every 3 years.","A system review every 3 years.","A system review every year.","An engagement review every 5 years."],"c":1,"r":["Engagement reviews are for firms that perform only engagements under SSARS or SSAEs not subject to system review.","Correct. Firms that perform engagements under SAS, Government Auditing Standards, examinations under SSAE, or PCAOB engagements not inspected by the PCAOB undergo a system review once every 3 years.","Peer reviews occur on a 3-year cycle.","The cycle is 3 years, and audit firms require system reviews."],"ref":"AICPA Standards for Performing and Reporting on Peer Reviews"},{"a":2,"q":"During fieldwork, the auditor learns that actual revenue will be 35% lower than the forecast amounts used to determine planning materiality. The auditor should:","o":["Retain planning materiality because it was set using the best information available at the time.","Revise materiality for the financial statements as a whole, and performance materiality as appropriate, and determine whether the nature, timing, and extent of further procedures remain appropriate.","Increase materiality to reduce the remaining audit work.","Document that no revision is needed because revenue is only one component."],"c":1,"r":["AU-C 320 requires revision when the auditor becomes aware of information that would have caused a different amount initially.","Correct. AU-C 320.12–.13 requires revision of materiality and consideration of the effect on the audit procedures when new information would have led to a different determination.","Lower revenue suggests materiality should decrease, not increase.","The revision requirement applies when the benchmark itself changes significantly."],"ref":"AU-C 320.12–.13"},{"a":2,"q":"An entity uses commercial off-the-shelf accounting software without access to source code; the vendor provides all updates. How does this most likely affect the auditor's identification of risks arising from IT?","o":["The risk of unauthorized changes to programs is typically lower, though risks related to access to data and configuration settings remain.","Risks arising from IT are eliminated, so no IT general controls need to be understood.","The auditor must test application controls at the vendor.","The auditor must obtain a SOC 2 report from the vendor."],"c":0,"r":["Correct. When the entity cannot modify source code, the risk of unauthorized program changes is reduced, but risks related to user access, configuration, and data still require understanding of related ITGCs (AU-C 315 as amended by SAS 145).","Risks are not eliminated. Access and configuration risks remain.","A software vendor is not a service organization processing the entity's transactions, so testing at the vendor is not required.","A SOC 2 report is not required for off-the-shelf software."],"ref":"AU-C 315 (SAS 145)"},{"a":2,"q":"In an integrated audit under PCAOB AS 2201, what is the primary purpose of performing a walkthrough?","o":["To test the operating effectiveness of all controls over a significant account.","To confirm the auditor's understanding of the flow of transactions, identify points where a misstatement could arise, evaluate design, and verify that controls have been implemented.","To provide substantive evidence regarding account balances.","To satisfy the requirement to test controls at interim dates."],"c":1,"r":["A walkthrough involves a single transaction and is not sufficient to test operating effectiveness over a period.","Correct. AS 2201.34 describes walkthroughs as the frequent and effective way to understand likely sources of misstatement, evaluate design, and confirm controls are in place.","A walkthrough is not designed as a substantive test.","Interim testing is a separate timing consideration."],"ref":"PCAOB AS 2201.34"},{"a":2,"q":"Under U.S. GAAP (ASC 205-40) and AU-C 570, the auditor's evaluation of whether there is substantial doubt about an entity's ability to continue as a going concern covers what period for a nonissuer?","o":["Twelve months after the balance sheet date.","One year after the date the financial statements are issued or available to be issued.","Until the next audit report date.","Three years from the balance sheet date."],"c":1,"r":["The balance sheet date is not the reference point under ASC 205-40.","Correct. Management (and the auditor) evaluates conditions within one year after the date the financial statements are issued, or available to be issued for nonissuers that do not file with the SEC.","The next report date is not a defined period.","The standard period is one year."],"ref":"ASC 205-40-50-1; AU-C 570"},{"a":2,"q":"An auditor has identified a significant risk related to the valuation of a complex derivative. If the auditor plans a purely substantive approach to this risk, which statement is correct?","o":["Substantive analytical procedures alone are sufficient.","The substantive procedures must include tests of details.","No substantive procedures are required if controls were evaluated for design and implementation.","The auditor must test controls over the derivative in the current period."],"c":1,"r":["When the approach to a significant risk consists only of substantive procedures, analytics alone are not enough.","Correct. AU-C 330.22 requires that when the approach to a significant risk consists only of substantive procedures, those procedures include tests of details.","Design and implementation evaluation does not reduce the need for substantive testing.","Controls must be tested in the current period only if the auditor plans to rely on them."],"ref":"AU-C 330.22"},{"a":2,"q":"The auditor concludes that management lacks competence in financial reporting and that the tone at the top is weak. These conditions most likely represent:","o":["Risks of material misstatement at the relevant assertion level for revenue.","Risks of material misstatement at the financial statement level, requiring overall responses such as assigning more experienced staff, increased supervision, and incorporating unpredictability.","A scope limitation requiring a disclaimer.","Matters that affect only the going-concern evaluation."],"c":1,"r":["These conditions are pervasive and are not limited to specific assertions.","Correct. Pervasive risks related to the control environment are financial statement-level risks that call for overall responses (AU-C 330.05).","They are not scope limitations unless evidence cannot be obtained.","They affect the overall risk assessment, not just going concern."],"ref":"AU-C 330.05"},{"a":2,"q":"A user entity outsources payroll to a service organization that has no SOC 1 report. Payroll is material. Which approach is acceptable for the user auditor to obtain evidence about the controls at the service organization?","o":["Refer to the absence of a SOC report in the audit opinion.","Perform tests of the relevant controls at the service organization or use another auditor to do so on the user auditor's behalf, or obtain sufficient evidence through substantive procedures.","Issue a disclaimer of opinion because no SOC report exists.","Rely on the service organization's marketing materials describing its controls."],"c":1,"r":["The auditor does not refer to the absence of a SOC report in an opinion.","Correct. AU-C 402 allows visiting the service organization and performing procedures, using another auditor, or performing substantive procedures, as alternatives to a Type 2 report.","A disclaimer is required only if sufficient evidence cannot be obtained.","Marketing materials are not audit evidence of operating effectiveness."],"ref":"AU-C 402.12, .16"},{"a":3,"q":"An auditor obtains the client's aged accounts receivable trial balance. What should the auditor do first before using it to select confirmations or evaluate the allowance?","o":["Send confirmations to all customers listed.","Foot the trial balance and agree the total to the general ledger control account, and test the aging categories.","Compare the balance to industry averages.","Obtain a management representation regarding its accuracy."],"c":1,"r":["Confirmation selection depends on a reliable listing.","Correct. The auditor must establish that information produced by the entity is complete and accurate (AU-C 500.09) by footing, agreeing to the GL, and testing aging before relying on it.","Industry comparisons do not test the listing's integrity.","Representations do not establish completeness and accuracy."],"ref":"AU-C 500.09"},{"a":3,"q":"Halsey Co. has inventory held on consignment at a dealer's location. Which procedure provides the best evidence of its existence and ownership?","o":["Inspecting the consignment agreement only.","Confirming the inventory directly with the consignee (and, if material, observing the count at the consignee's location or reviewing its reports), and examining the consignment agreement.","Excluding the items from Halsey's inventory.","Relying on Halsey's perpetual records."],"c":1,"r":["The agreement supports rights but not the quantity on hand.","Correct. AU-C 501.A9 notes that for inventory under the control of third parties, the auditor obtains evidence through confirmation and, depending on materiality and risk, inspection or other procedures.","Consigned-out goods belong to the consignor and should be included in its inventory.","Internal records alone are insufficient for third-party-held inventory."],"ref":"AU-C 501.A9"},{"a":3,"q":"For leases accounted for under ASC 842, which procedure best tests the accuracy and valuation of a lessee's lease liability?","o":["Confirming the lease payments with the lessor and recomputing the present value of the remaining lease payments using the appropriate discount rate.","Reviewing rent expense for the year.","Observing the leased asset.","Inquiring of management whether new leases were signed."],"c":0,"r":["Correct. Recomputing the present value of remaining payments, with payment terms confirmed or agreed to lease contracts and the discount rate evaluated, directly tests the liability's measurement.","Rent expense analysis may identify unrecorded leases (completeness) but does not test liability measurement.","Observation supports existence of the ROU asset, not liability valuation.","Inquiry alone is insufficient."],"ref":"ASC 842; liability procedures"},{"a":3,"q":"Which procedure is most likely to help identify previously undisclosed related parties?","o":["Confirming accounts receivable balances with major customers.","Reviewing the minutes of board meetings, conflict-of-interest statements, and significant contracts and agreements, and inquiring of management.","Recomputing depreciation.","Performing a cash proof."],"c":1,"r":["Confirmations rarely reveal relationships.","Correct. AU-C 550 identifies records such as minutes, conflict-of-interest statements, tax returns, and significant contracts as sources for identifying related parties and transactions.","Depreciation recomputation is unrelated.","A cash proof tests cash transactions, not relationships."],"ref":"AU-C 550.15"},{"a":3,"q":"Recalculating depreciation expense for a sample of assets primarily tests which assertion?","o":["Existence of PP&E","Accuracy, valuation, and allocation","Rights and obligations","Completeness of PP&E"],"c":1,"r":["Recalculation does not show the assets exist.","Correct. Depreciation is an allocation of cost, so recalculation tests accuracy and valuation and allocation.","Ownership requires examining titles or invoices.","Completeness is tested by procedures such as reviewing repairs expense."],"ref":"PP&E procedures"},{"a":3,"q":"Which situation is LEAST suitable for monetary unit sampling (MUS)?","o":["Testing accounts receivable for overstatement.","Testing accounts payable for understatement, where unrecorded liabilities have a zero recorded balance.","Testing inventory for overstatement when few misstatements are expected.","Testing fixed asset additions for existence."],"c":1,"r":["Overstatement testing is MUS's strength.","Correct. In MUS, items are selected in proportion to their recorded amounts, so zero or understated balances have little or no chance of selection. That makes MUS poorly suited for testing understatement.","Low expected misstatement makes MUS efficient.","Existence (overstatement) testing is well suited to MUS."],"ref":"AICPA Audit Sampling Guide"},{"a":3,"q":"Which of the following best describes the concept of <b>sufficient appropriate audit evidence</b>?","o":["Evidence that is conclusive about each assertion.","Sufficiency refers to the quantity of evidence; appropriateness refers to its quality (relevance and reliability); together the evidence should be persuasive rather than conclusive.","Evidence that includes at least one confirmation for each account.","Evidence obtained solely from external sources."],"c":1,"r":["Audit evidence is usually persuasive, not conclusive.","Correct. AU-C 500 defines sufficiency as the measure of quantity and appropriateness as quality, relevance, and reliability. The auditor seeks persuasive evidence.","No such rule exists.","Internal evidence can be appropriate, especially when controls are effective."],"ref":"AU-C 500.05"},{"a":3,"q":"Management requests that the auditor not send a confirmation to a particular major customer, explaining that the customer is in a sensitive contract dispute. Under AU-C 505, the auditor should:","o":["Agree without further consideration because management knows its customers best.","Inquire about management's reasons, seek evidence of their validity and reasonableness, evaluate the implications for risk assessment, and perform alternative procedures.","Send the confirmation anyway.","Immediately disclaim an opinion."],"c":1,"r":["The auditor must evaluate the request with skepticism.","Correct. AU-C 505.08 requires inquiry into and evaluation of the reasons, consideration of the effect on fraud risk assessment, and alternative procedures. If the refusal is unreasonable, the auditor communicates with TCWG and considers the implications for the opinion.","The auditor generally respects a reasonable request but must address the account through alternatives.","A disclaimer is not automatic. Alternatives may suffice."],"ref":"AU-C 505.08–.09"},{"a":4,"q":"In the current-year audit, the auditor's updated opinion on prior-period financial statements differs from the opinion previously expressed (the prior misstatement has now been corrected). The auditor should:","o":["Not mention the change.","Disclose in an other-matter paragraph the date of the previous report, the type of opinion previously expressed, the reasons for it, the different opinion now expressed, and the reasons for the change.","Issue a disclaimer on the prior period.","Include an emphasis-of-matter paragraph only."],"c":1,"r":["The change must be explained to users.","Correct. AU-C 700.53 requires an other-matter paragraph with these details when the updated opinion differs from the previous opinion.","The auditor can express an updated opinion and need not disclaim.","An EOM paragraph is not the prescribed vehicle for this situation."],"ref":"AU-C 700.53"},{"a":4,"q":"An auditor is engaged to report on summary financial statements derived from audited financial statements. Under AU-C 810, the auditor's opinion states whether the summary financial statements are:","o":["Presented fairly in accordance with GAAP.","Consistent, in all material respects, with the audited financial statements from which they have been derived, in accordance with the applied criteria.","Free from fraud.","Complete."],"c":1,"r":["Summary statements do not contain all GAAP-required disclosures.","Correct. The AU-C 810 opinion addresses consistency with the audited statements based on the applied criteria.","Fraud is not the subject of the opinion.","Completeness is not the standard."],"ref":"AU-C 810.17"},{"a":1,"q":"Ruby Corp., a nonpublic attest client, files a lawsuit against its CPA firm alleging deficiencies in the prior-year audit. Which statement best describes the effect on independence?","o":["No effect, because litigation is unrelated to financial interests.","Independence is impaired because the threat from adverse interest is significant and safeguards cannot reduce it to an acceptable level.","Independence is impaired only if the claim exceeds the firm's malpractice insurance.","Independence is impaired only once a court rules against the firm."],"c":1,"r":["Litigation creates adverse interest threats addressed by the Code.","Correct. ET 1.290.010 states that when the client or its management commences litigation alleging deficiencies in audit work, independence is impaired.","The size of the claim relative to insurance is not the test.","Impairment arises when litigation alleging audit deficiencies is commenced, not upon judgment."],"ref":"ET 1.290.010"},{"a":1,"q":"A CPA firm wishes to admit non-CPA owners. Under the AICPA Code's Form of Organization and Name Rule, which condition must be met?","o":["Non-CPAs may own up to 75% of the firm if they are licensed attorneys.","CPAs must own a majority (more than 50%) of the firm's financial interests and voting rights, and a CPA must have ultimate responsibility for attest services.","Non-CPA owners may sign audit reports if supervised by a CPA.","Non-CPA owners are prohibited in all circumstances."],"c":1,"r":["No such exception exists for attorneys.","Correct. ET 1.810.050 permits non-CPA ownership if CPAs own a majority of financial interests and voting rights, a CPA has ultimate responsibility for attest services, and other conditions are met.","Non-CPA owners cannot assume ultimate responsibility for attest engagements.","Alternative practice structures and minority non-CPA owners are permitted."],"ref":"ET 1.810.050"},{"a":1,"q":"A CPA serves as an honorary director of a not-for-profit organization that is an attest client. Independence is NOT impaired provided that:","o":["The CPA's position is clearly honorary, the CPA's name appears only in that capacity, and the CPA does not vote or otherwise participate in board or management functions.","The CPA attends board meetings but abstains from votes on financial matters.","The CPA receives no compensation for serving.","The CPA serves on the finance committee only."],"c":0,"r":["Correct. ET 1.275.010 permits honorary directorships of NFP attest clients when the position is clearly honorary, it is identified as such in materials, and the member does not vote or participate in governance or management.","Attending and participating in board activities beyond an honorary role impairs independence.","Lack of compensation alone does not make the position honorary.","Serving on a finance committee is participation in governance."],"ref":"ET 1.275.010"},{"a":2,"q":"A company's profit before tax fluctuates widely from year to year, and the current year is near break-even. Which approach to materiality is most appropriate?","o":["Use current-year profit before tax, since it is the standard benchmark.","Consider a more stable benchmark, such as revenue or total assets, or a normalized profit based on prior years.","Set materiality at zero.","Use the prior year's materiality without change."],"c":1,"r":["A near-zero profit would produce an unreasonably low materiality.","Correct. AU-C 320.A7–A8 notes that when profit is volatile, other benchmarks or normalized profit may be more appropriate.","Zero materiality is impractical.","Prior-year materiality must be reassessed based on current circumstances."],"ref":"AU-C 320.A7–A8"},{"a":2,"q":"In a small owner-managed business, the owner reviews and approves all disbursements and signs all checks. Segregation of duties among the two accounting employees is limited. How might the owner's involvement affect the auditor's assessment?","o":["It always eliminates the risk of misstatement.","It may mitigate the lack of segregation of duties, although it also increases the risk of management override.","It has no effect on the risk assessment.","It requires a disclaimer due to the lack of controls."],"c":1,"r":["No control eliminates risk entirely.","Correct. Active owner oversight can compensate for limited segregation of duties, but it also creates override risk, which the auditor must consider.","Owner involvement is relevant to the control environment and control activities.","Limited controls do not by themselves require a disclaimer."],"ref":"AU-C 315.A92"},{"a":2,"q":"Under AU-C 315 as amended by SAS No. 145, the auditor's assessment of inherent risk for an identified risk of material misstatement is based on:","o":["The size of the account balance only.","The likelihood and magnitude of misstatement, considering how and the degree to which inherent risk factors affect susceptibility to misstatement.","The effectiveness of the entity's controls.","Whether the auditor plans to use sampling."],"c":1,"r":["Size alone does not determine inherent risk.","Correct. SAS 145 requires assessing inherent risk on a spectrum by considering the likelihood and magnitude of misstatement and the inherent risk factors.","Controls relate to control risk, which is assessed separately.","Sampling plans do not determine inherent risk."],"ref":"AU-C 315.31 (SAS 145)"},{"a":2,"q":"When the auditor assesses the risk of material misstatement for an assertion as high, which timing for substantive procedures is generally most appropriate?","o":["At an interim date with no roll-forward procedures.","At or near the period end.","Only during the prior year's audit.","At any time, since timing has no effect on detection risk."],"c":1,"r":["Interim testing without roll-forward increases the risk that misstatements arising later go undetected.","Correct. Higher RMM calls for more persuasive evidence, typically substantive procedures at or near period end (AU-C 330.A11).","Prior-year procedures provide no evidence about the current period.","Timing affects the persuasiveness of evidence."],"ref":"AU-C 330.A11"},{"a":2,"q":"In obtaining an understanding of related party relationships and transactions, the auditor should inquire of management about the controls that management has established to:","o":["Ensure all related parties are paid promptly.","Identify, account for, and disclose related party relationships and transactions, and to authorize and approve significant transactions with related parties and those outside the normal course of business.","Prevent all related party transactions.","Report related parties to regulators."],"c":1,"r":["Payment timing is not the focus.","Correct. AU-C 550.14 requires understanding controls over identifying, accounting for, disclosing, authorizing, and approving related party transactions.","Related party transactions are not prohibited.","Regulatory reporting is not part of this requirement."],"ref":"AU-C 550.14"},{"a":2,"q":"In an initial audit engagement, which statement about opening balances is correct under AU-C 510?","o":["Opening balances need not be considered because the predecessor audited them.","The auditor should obtain sufficient appropriate evidence about whether opening balances contain misstatements that materially affect the current period, and whether accounting policies have been consistently applied.","The auditor must reaudit the prior year in full.","The auditor may rely on management's representation that opening balances are correct."],"c":1,"r":["The auditor must obtain evidence about opening balances even if previously audited.","Correct. AU-C 510.08 requires this evidence, for example through reviewing predecessor working papers, current-period procedures, or specific tests.","A full reaudit is not required.","Representations are insufficient alone."],"ref":"AU-C 510.08"},{"a":2,"q":"An auditor uses data visualization of daily revenue transactions during risk assessment and identifies an unusual spike in sales to a single new distributor in the last three days of the year. The most appropriate next step is to:","o":["Conclude there is no risk because visualization is not an audit procedure.","Consider the spike in identifying and assessing risks of material misstatement (for example, cutoff and occurrence) and design further procedures responsive to that risk.","Propose an adjustment to reverse the sales.","Ignore it because it relates to a new customer."],"c":1,"r":["Audit data analytics can serve as risk assessment procedures.","Correct. Unusual patterns identified through analytics inform the risk assessment and the design of responsive further procedures.","An adjustment is premature without evidence of misstatement.","New-customer, period-end spikes are a risk indicator."],"ref":"AU-C 315; AICPA Guide to Audit Data Analytics"},{"a":3,"q":"After year-end, Benton Co. issued credit memos for a large volume of goods returned by customers that were sold in December. Which risk is most directly indicated?","o":["Understatement of December sales.","Overstatement of December sales and receivables (and possibly an inadequate allowance for sales returns).","Understatement of inventory.","Overstatement of accounts payable."],"c":1,"r":["Large returns suggest the opposite.","Correct. Heavy post-year-end returns of December sales may indicate improper revenue recognition (for example, channel stuffing) or an understated returns allowance.","Returns increase inventory when received. The risk is with sales.","Payables are unaffected."],"ref":"Revenue cycle procedures"},{"a":3,"q":"A proof of cash for the month of December is most likely to detect:","o":["Lapping of receivables posted to the wrong customers.","Unrecorded cash receipts or disbursements, by reconciling receipts and disbursements per bank to per books for the period.","Kiting between two banks in different months.","Obsolete inventory."],"c":1,"r":["Lapping misapplies receipts among customers. Total receipts may still reconcile.","Correct. A proof of cash (four-column reconciliation) reconciles beginning balance, receipts, disbursements, and ending balance per bank with books and can reveal unrecorded transactions.","Kiting is better detected with a bank transfer schedule.","Inventory is unrelated."],"ref":"Cash procedures"},{"a":3,"q":"Which procedure provides the best evidence of the existence of significant additions to equipment during the year?","o":["Recalculating depreciation on the additions.","Physically inspecting a sample of the additions and examining supporting invoices.","Reviewing the repairs and maintenance account.","Reading board minutes for approvals."],"c":1,"r":["Depreciation recomputation addresses valuation.","Correct. Physical inspection, combined with vouching to invoices, provides strong evidence of existence (and support for cost).","Reviewing repairs addresses completeness.","Approvals show authorization, not existence."],"ref":"PP&E procedures"},{"a":3,"q":"Which procedure is most likely to identify a client's guarantee of a related company's bank loan?","o":["Reviewing the accounts payable subledger.","Sending confirmations to financial institutions requesting information on contingent liabilities, guarantees, and other arrangements, and reading board minutes.","Recomputing interest expense.","Reviewing payroll records."],"c":1,"r":["Guarantees are not recorded in payables.","Correct. Guarantees are often unrecorded. Separate bank confirmations of contingent liabilities and reading minutes and agreements help identify them.","Interest expense would not reflect a guarantee of another's debt.","Payroll is unrelated."],"ref":"AU-C 501; AU-C 505"},{"a":3,"q":"To evaluate the reasonableness of a client's warranty reserve, an auditor would most likely:","o":["Confirm the reserve with customers.","Compare prior-period warranty estimates with actual claims paid (a retrospective review) and evaluate trends in claim rates and costs.","Inspect inventory.","Confirm with the client's attorney."],"c":1,"r":["Customers cannot confirm an estimate of future claims.","Correct. Historical experience and retrospective review provide evidence for evaluating the estimate's assumptions.","Inventory inspection is unrelated.","Warranty reserves are not legal contingencies requiring attorney confirmation."],"ref":"AU-C 540"},{"a":3,"q":"After performing a substantive test of details using a sample, the auditor found misstatements. To evaluate the results, the auditor should:","o":["Consider only the misstatements actually found in the sample.","Project the misstatements found to the population and consider the projected misstatement, together with an allowance for sampling risk, relative to tolerable misstatement.","Ignore misstatements below performance materiality.","Increase the sample size until no misstatements are found."],"c":1,"r":["Known misstatements alone ignore the unsampled portion.","Correct. AU-C 530.14 requires projection of misstatements found to the population and evaluation of sampling risk.","Individually small misstatements can be significant when projected.","Expanding the sample is one option, but evaluation must be based on projection."],"ref":"AU-C 530.14"},{"a":3,"q":"The auditor determined that ITGCs over program changes and access are effective, and tested an automated three-way-match control in a prior year. The control has not changed. Which approach is most appropriate under GAAS?","o":["Retest the automated control with a sample of 60 items each year.","Benchmark the automated control: rely on ITGC testing showing no changes, and test the control at least once every third audit (testing some controls each year).","Never rely on prior-year evidence for automated controls.","Rely on the control without any evidence of ITGC effectiveness."],"c":1,"r":["Automated controls operate consistently, so large samples are typically unnecessary.","Correct. Effective ITGCs support the continued functioning of automated controls, allowing use of prior-audit evidence subject to the rotation limits of AU-C 330.","Prior evidence may be used under AU-C 330.14–.15.","ITGC effectiveness is essential to relying on automated controls."],"ref":"AU-C 330.14–.15"},{"a":3,"q":"In a SOC 1 Type 2 engagement, the service auditor tests controls at the service organization. Which procedure is the service auditor most likely to perform?","o":["Testing complementary user entity controls at each user entity.","Testing the operating effectiveness of controls at the service organization over the specified period and describing tests and results.","Issuing an opinion on the user entities' financial statements.","Confirming user entities' account balances."],"c":1,"r":["CUECs operate at user entities and are not tested by the service auditor.","Correct. AT-C 320 Type 2 reports include tests of operating effectiveness and the results.","The service auditor does not opine on user entities' statements.","Balance confirmation is a user auditor procedure."],"ref":"AT-C 320"},{"a":4,"q":"In an initial audit, the auditor was engaged after year-end and could not observe the opening inventory or obtain sufficient evidence about it. Closing inventory was observed and audited satisfactorily. The auditor should most likely issue:","o":["An unmodified opinion on all statements.","A qualified opinion (or disclaimer) on the results of operations and cash flows, and an unmodified opinion on the balance sheet.","An adverse opinion on all statements.","A disclaimer on the balance sheet only."],"c":1,"r":["The opening inventory affects cost of goods sold and therefore the income statement and cash flows.","Correct. AU-C 510.A9 notes that such a scope limitation affects the results of operations and cash flows, but not the closing balance sheet.","Adverse opinions relate to misstatements, not scope limitations.","The balance sheet is supported by evidence."],"ref":"AU-C 510.A9; AU-C 705"},{"a":4,"q":"Under AU-C 260, which matter must the auditor communicate to those charged with governance?","o":["The detailed audit program.","Significant difficulties encountered during the audit, disagreements with management, uncorrected misstatements, and significant findings or issues discussed with management.","The names of staff who worked on the engagement.","The auditor's billing rates."],"c":1,"r":["Detailed procedures are not communicated, as that could reduce effectiveness.","Correct. AU-C 260.12–.14 lists these significant findings from the audit.","Staff names are not required.","Billing rates are not required."],"ref":"AU-C 260.12–.14"},{"a":1,"q":"Under PCAOB Rule 3523, a registered firm is not independent of its issuer audit client if it provides tax services during the audit period to:","o":["The issuer's corporate tax department.","A person in a financial reporting oversight role at the issuer (or an immediate family member of such person), subject to limited exceptions.","Members of the issuer's board who are not in a financial reporting oversight role.","Any employee of the issuer."],"c":1,"r":["Tax services to the issuer itself may be permitted with preapproval.","Correct. Rule 3523 prohibits tax services to persons in financial reporting oversight roles at the issuer, with limited exceptions (for example, persons who are in such roles only because they serve on the board).","Independent directors serving only in a board capacity fall under an exception.","The prohibition is targeted at financial reporting oversight roles."],"ref":"PCAOB Rule 3523"},{"a":1,"q":"Under the AICPA Code, during which period must a covered member be independent of an attest client for an audit of financial statements?","o":["Only on the report date.","During both the period covered by the financial statements and the period of the professional engagement.","Only during fieldwork.","Only during the period of the professional engagement."],"c":1,"r":["Independence is required over periods, not just on one date.","Correct. ET 1.200.001 states that independence must be maintained during the period of the professional engagement and the period covered by the financial statements.","Independence is required beyond fieldwork.","The period covered by the financial statements is also included."],"ref":"ET 1.200.001"},{"a":1,"q":"Is independence required for an agreed-upon procedures engagement performed under AT-C 215?","o":["No, because no opinion is expressed.","Yes, the practitioner must be independent.","Only if the report is for general use.","Only if the engaging party is a public company."],"c":1,"r":["Even without an opinion, AUP is an attestation engagement requiring independence.","Correct. AT-C 105 and AT-C 215 require independence for all attestation engagements, including AUP.","Independence is required regardless of report use.","The requirement does not depend on the engaging party's status."],"ref":"AT-C 105; AT-C 215"},{"a":2,"q":"Which situation best reflects a strength in the control environment?","o":["The board of directors includes a majority of members who are independent of management and exercise oversight of internal control.","The CEO approves all journal entries personally.","Internal audit reports to the CFO and has no access to the audit committee.","Management sets aggressive targets and tolerates deviations from policy to achieve them."],"c":0,"r":["Correct. COSO Principle 2: the board demonstrates independence from management and exercises oversight.","CEO approval of entries is a control activity and may raise override concerns.","Lack of access to TCWG weakens the control environment and internal audit's objectivity.","Tolerating deviations weakens tone at the top."],"ref":"COSO Principle 2"},{"a":2,"q":"During the year, the client adopted a new revenue recognition system and changed its sales commission structure. Which inherent risk factor do these most directly represent?","o":["Subjectivity","Change","Uncertainty","Susceptibility to fraud"],"c":1,"r":["Subjectivity involves judgment in measurement.","Correct. New systems and changes in incentives are changes in the entity's environment, which can increase susceptibility to misstatement.","Uncertainty involves inability to measure precisely.","Commission changes could affect fraud risk, but the most direct factor is change."],"ref":"AU-C 315 (SAS 145)"},{"a":2,"q":"In planning, the auditor assesses inherent risk as high and control risk as high for the valuation of inventory. To keep audit risk at an acceptably low level, the auditor should:","o":["Increase acceptable detection risk.","Decrease acceptable detection risk by performing more extensive, more effective, or better-timed substantive procedures.","Reduce substantive procedures because control risk was assessed.","Rely on controls."],"c":1,"r":["Higher RMM requires lower, not higher, detection risk.","Correct. Detection risk is inversely related to RMM, so more persuasive substantive evidence is needed.","High RMM requires more substantive work.","Control risk was assessed as high, so controls will not be relied upon."],"ref":"AU-C 200; AU-C 330"},{"a":2,"q":"In an integrated audit, the auditor tests controls at an interim date. To express an opinion on ICFR as of year-end, the auditor should:","o":["Do nothing further.","Obtain evidence about the operation of controls in the roll-forward period, considering the specific controls, results of interim tests, the length of the remaining period, and changes in ICFR.","Retest all controls at year-end.","Disclaim on ICFR."],"c":1,"r":["The opinion is as of year-end, so roll-forward evidence is needed.","Correct. AS 2201.55–.56 describes the factors for determining roll-forward procedures.","A full retest is not required.","No disclaimer is warranted."],"ref":"PCAOB AS 2201.55–.56"},{"a":2,"q":"The primary objective of performing analytical procedures as risk assessment procedures is to:","o":["Obtain substantive evidence about account balances.","Identify aspects of the entity of which the auditor was unaware and help assess risks of material misstatement, including unusual transactions, ratios, and trends.","Replace tests of details.","Evaluate the overall presentation at the end of the audit."],"c":1,"r":["Planning analytics are not primarily substantive.","Correct. AU-C 315.A15 states that risk assessment analytics help identify unusual relationships that may indicate risks.","Risk assessment analytics do not replace tests of details.","The overall review occurs at the end of the audit (AU-C 520.06)."],"ref":"AU-C 315.A15"},{"a":2,"q":"Which procedure is a required component of the auditor's understanding of the entity's information system relevant to financial reporting under AU-C 315 as amended by SAS No. 145?","o":["Testing the operating effectiveness of all IT controls.","Understanding how information flows through the information system, including how transactions are initiated, recorded, processed, corrected as necessary, and incorporated in the general ledger and reported, including journal entries.","Confirming the IT budget with management.","Determining the cost of the information system."],"c":1,"r":["Understanding does not require tests of operating effectiveness.","Correct. SAS 145 requires understanding information processing activities, including journal entries (standard and nonstandard).","The IT budget is not part of the required understanding.","Cost is irrelevant."],"ref":"AU-C 315.25 (SAS 145)"},{"a":3,"q":"A client recognized revenue under a bill-and-hold arrangement at year-end. Which procedure is most appropriate?","o":["Confirm the receivable only.","Examine the arrangement for evidence that the criteria for revenue recognition are met, such as a substantive reason for the arrangement requested by the customer, separate identification of goods, readiness for transfer, and inability of the seller to redirect the goods; consider confirming terms with the customer.","Accept the revenue because invoices were issued.","Observe the goods in the warehouse only."],"c":1,"r":["Confirmation of the balance does not address whether control has transferred.","Correct. ASC 606 sets specific bill-and-hold criteria, which the auditor tests. Bill-and-hold arrangements are a recognized fraud risk area.","Invoicing alone does not determine control transfer.","Observation supports existence of goods but not the recognition criteria."],"ref":"ASC 606-10-55-81–84; AU-C 240"},{"a":3,"q":"When confirming a note payable with a lender, the auditor should request information about which of the following?","o":["The lender's financial condition.","The balance, interest rate, maturity, collateral, and other terms, including any guarantees or covenant violations known to the lender.","The client's sales volume.","The lender's audit fees."],"c":1,"r":["The lender's financial condition is irrelevant.","Correct. Confirmation of debt terms supports existence, completeness, valuation, and disclosure.","Sales volume is unrelated.","Audit fees are irrelevant."],"ref":"AU-C 505; debt procedures"},{"a":3,"q":"The client's income tax provision was prepared by an outside tax firm. The auditor should:","o":["Accept the provision because it was prepared by tax experts.","Evaluate the tax firm as a management's specialist and test the provision, including recomputing current and deferred tax amounts and evaluating uncertain tax positions, possibly using the audit firm's tax specialists.","Prepare the tax provision for the client.","Exclude taxes from the audit scope."],"c":1,"r":["Specialist work requires evaluation.","Correct. AU-C 500.08 governs the use of a management's specialist, and the auditor tests the provision's components.","Preparing the provision would create a self-review threat for the auditor (and potentially impair independence).","Taxes are material and within scope."],"ref":"AU-C 500.08; ASC 740"},{"a":3,"q":"When using nonstatistical sampling, which factor would decrease the required sample size for a substantive test of details?","o":["An increase in the assessed risk of material misstatement.","A decrease in tolerable misstatement.","An increase in the assurance obtained from other substantive procedures directed at the same assertion.","An increase in expected misstatement."],"c":2,"r":["Higher RMM increases sample size.","Lower tolerable misstatement increases sample size.","Correct. Evidence from other procedures reduces the assurance needed from the sample, reducing sample size.","Higher expected misstatement increases sample size."],"ref":"AICPA Audit Sampling Guide"},{"a":3,"q":"Which statement correctly distinguishes recalculation from reperformance?","o":["They are the same procedure.","Recalculation checks the mathematical accuracy of documents or records; reperformance is the auditor's independent execution of procedures or controls originally performed as part of internal control.","Recalculation is only used for tests of controls.","Reperformance is only used for inventory."],"c":1,"r":["They differ under AU-C 500.","Correct. AU-C 500.A21–A22 defines both.","Recalculation is often substantive.","Reperformance is used broadly."],"ref":"AU-C 500.A21–A22"},{"a":3,"q":"After the documentation completion date, the auditor finds it necessary to add documentation to the audit file. Under AU-C 230, the auditor:","o":["May not modify the file in any way.","May add documentation but must not delete or discard existing documentation, and must document the specific reasons for the additions, when and by whom they were made and reviewed.","May replace existing documentation with updated versions.","Must reissue the auditor's report."],"c":1,"r":["Additions are permitted.","Correct. AU-C 230.18–.19 permits additions with documentation of when, by whom, and why, but no deletions.","Existing documentation cannot be deleted or discarded.","Reissuance is not required solely because documentation is added."],"ref":"AU-C 230.18–.19"},{"a":3,"q":"Which of the following statements about the auditor's subsequent events responsibilities is correct?","o":["The auditor must continue to perform subsequent-event procedures after the report date until the financial statements are issued.","The auditor has no obligation to perform procedures after the report date, but if facts become known before the report release date that might have caused the report to be amended, the auditor should discuss them with management and determine whether the statements need revision.","The auditor's responsibility ends at the balance sheet date.","The auditor must redate the report whenever the statements are issued later than the report date."],"c":1,"r":["Active procedures are performed through the report date, not afterward.","Correct. AU-C 560.12 addresses facts that become known after the report date but before release.","Procedures extend through the report date.","Redating is not required solely because issuance occurs later."],"ref":"AU-C 560.12"},{"a":4,"q":"Prior-period financial statements presented comparatively were not audited, reviewed, or compiled. The current-year auditor's report should:","o":["Ignore the prior period.","Include an other-matter paragraph stating that the prior-period statements were not audited, reviewed, or compiled and that no opinion or assurance is expressed on them; the prior-period statements should be marked appropriately.","Qualify the opinion on the current period.","Disclaim on both periods."],"c":1,"r":["Users must be informed about the prior period.","Correct. AU-C 700.55 requires this other-matter paragraph.","The current-period opinion is not affected.","No disclaimer on the current period is needed."],"ref":"AU-C 700.55"},{"a":4,"q":"Under AU-C 450, which communication regarding uncorrected misstatements is required?","o":["The auditor need not communicate uncorrected misstatements if they are immaterial.","The auditor should communicate uncorrected misstatements and their effect, individually and in aggregate, to those charged with governance and request that they be corrected.","Uncorrected misstatements are disclosed in the auditor's report.","The auditor should correct them on management's behalf."],"c":1,"r":["Communication is required regardless of materiality (except clearly trivial items).","Correct. AU-C 450.12 requires communication to TCWG and a request for correction.","They are not disclosed in the report.","Correction is management's responsibility."],"ref":"AU-C 450.12"}],"tbs":[{"a":2,"title":"Risk Assessment: Inherent Risk Factors and Assertions","instr":"<p>You are planning the audit of <b>Ridgeway Pharma, Inc.</b> For each matter in the exhibit, select (a) the <b>inherent risk factor</b> most directly illustrated, and (b) the <b>relevant assertion</b> most at risk.</p>","exhibits":[{"title":"Planning Notes","html":"<table><tr><th>#</th><th>Matter</th></tr><tr><td>A</td><td>Ridgeway estimates its liability for product returns using a model that requires management to predict pharmacy returns up to 36 months after sale.</td></tr><tr><td>B</td><td>In October, Ridgeway migrated its inventory system to a new cloud ERP platform; about 4% of item records failed to transfer and had not been re-entered at year-end.</td></tr><tr><td>C</td><td>Ridgeway's revenue includes multi-element licensing arrangements with variable consideration and milestone payments.</td></tr><tr><td>D</td><td>Sales management bonuses double if Q4 revenue exceeds budget by 10%, and the team found shipping documents for early-January shipments re-dated to late December.</td></tr></table>"}],"lists":{"irf":["Complexity","Subjectivity","Change","Uncertainty","Susceptibility to misstatement due to management bias or fraud"],"asr":["Occurrence / existence","Completeness","Accuracy, valuation & allocation","Cutoff","Rights & obligations"]},"rows":[{"p":"Matter A: inherent risk factor","list":"irf","a":3,"e":"A long-horizon prediction of returns cannot be measured precisely. Estimation uncertainty is the dominant factor."},{"p":"Matter A: assertion most at risk","list":"asr","a":2,"e":"The issue is the measurement of the returns liability: valuation."},{"p":"Matter B: inherent risk factor","list":"irf","a":2,"e":"A system conversion during the year is a change in the entity's IT environment."},{"p":"Matter B: assertion most at risk","list":"asr","a":1,"e":"Records that never transferred mean items missing from the system: completeness."},{"p":"Matter C: inherent risk factor","list":"irf","a":0,"e":"Multi-element arrangements with variable consideration require complex application of ASC 606."},{"p":"Matter C: assertion most at risk","list":"asr","a":2,"e":"Allocation of transaction price and measurement of variable consideration relate to accuracy/valuation."},{"p":"Matter D: inherent risk factor","list":"irf","a":4,"e":"Compensation tied to revenue targets creates incentive for management bias or fraud."},{"p":"Matter D: assertion most at risk","list":"asr","a":3,"e":"Re-dating January shipments into December records sales in the wrong period: cutoff."}],"ref":"AU-C 315 (SAS 145); AU-C 240"},{"a":2,"title":"Fraud Risk Factors","instr":"<p>During planning for <b>Brightline Retail, Inc.</b>, the team identified the conditions in the exhibit. For each, select the fraud triangle element and the type of fraud it most directly relates to.</p>","exhibits":[{"title":"Conditions Noted","html":"<ol><li>Brightline must maintain a minimum current ratio of 1.5 under a new loan agreement; the ratio is currently 1.52.</li><li>The CEO dominates management, and the board rarely challenges her decisions.</li><li>Store managers handle large cash receipts, and no one reconciles daily register tapes to deposits.</li><li>The CFO has repeatedly argued that “everyone in retail” stretches inventory reserve assumptions.</li><li>Several warehouse employees have been told they will be laid off next quarter.</li><li>Inventory of small, high-value electronics is kept in an unlocked area.</li></ol>"}],"lists":{"tri":["Incentive / pressure","Opportunity","Attitude / rationalization"],"typ":["Fraudulent financial reporting","Misappropriation of assets"]},"rows":[{"p":"Condition 1: element","list":"tri","a":0,"e":"Debt covenant thresholds create pressure to manipulate results."},{"p":"Condition 1: type","list":"typ","a":0,"e":"Covenant pressure relates to misstating financial results."},{"p":"Condition 2: element","list":"tri","a":1,"e":"Domination by a single person with ineffective board oversight creates opportunity."},{"p":"Condition 3: element","list":"tri","a":1,"e":"Lack of reconciliation over cash creates opportunity."},{"p":"Condition 3: type","list":"typ","a":1,"e":"Unreconciled cash receipts enable theft of cash."},{"p":"Condition 4: element","list":"tri","a":2,"e":"Justifying aggressive estimates because “everyone does it” is rationalization."},{"p":"Condition 5: element","list":"tri","a":0,"e":"Known or anticipated layoffs create pressure or grievances (an AU-C 240 misappropriation factor), often combined with attitude."},{"p":"Condition 6: type","list":"typ","a":1,"e":"Small, high-value, unsecured items are susceptible to theft."}],"ref":"AU-C 240 Appendix A"},{"a":2,"title":"Planned Responses to Assessed Risks","instr":"<p>You are completing the audit plan for <b>Weston Components, Inc.</b> (nonissuer, year ending December 31, 20X6). For each situation in the planning memo, select the response that is <b>required or most appropriate</b> under AU-C 330 and AU-C 240.</p>","exhibits":[{"title":"Planning Memo","html":"<table><tr><th>#</th><th>Situation</th></tr><tr><td>1</td><td>Revenue cutoff is assessed as a <b>significant risk</b>. The team will not rely on controls over cutoff.</td></tr><tr><td>2</td><td>The RMM for the <b>existence</b> of accounts receivable is assessed as <b>high</b>. The team proposes confirming balances as of September 30.</td></tr><tr><td>3</td><td>Payroll controls were tested and are effective. RMM for payroll expense is <b>low</b>, and payroll varies predictably with headcount and pay rates.</td></tr><tr><td>4</td><td>The team concluded that the control environment is weak: management overrides policies and accounting staff turnover was 60%.</td></tr><tr><td>5</td><td>The team identified a fraud risk that sales staff grant distributors undocumented rights of return.</td></tr><tr><td>6</td><td>The team tested the operating effectiveness of purchasing controls for January–September and plans to rely on them for the full year.</td></tr><tr><td>7</td><td>A control that addresses a <b>significant risk</b> was tested last year, has not changed, and the team plans to rely on it this year.</td></tr><tr><td>8</td><td>The assessed RMM for inventory valuation increased from moderate to high since last year.</td></tr></table>"}],"rows":[{"p":"Situation 1","o":["Substantive analytical procedures alone are sufficient","Substantive procedures that include tests of details, such as examining shipping documents and recording dates for transactions near year-end","Inquiry of the sales manager","No procedures, because the risk is addressed by management's representation"],"a":1,"e":"When the approach to a significant risk consists only of substantive procedures, those procedures must include tests of details (AU-C 330.22)."},{"p":"Situation 2","o":["Confirm at September 30 with no further work for the remaining period","Perform the confirmations at or near year-end (or, if performed at interim, perform substantive procedures covering the roll-forward period that provide a reasonable basis to extend the conclusions)","Replace confirmations with inquiry of the credit manager","Reduce the number of confirmations because risk is high"],"a":1,"e":"Higher RMM calls for more persuasive evidence, typically obtained closer to period end. Interim work needs roll-forward procedures (AU-C 330.23)."},{"p":"Situation 3","o":["Substantive analytical procedures on payroll expense may provide sufficient substantive evidence","No substantive procedures are needed because controls are effective","Confirm salaries with every employee","Test 100% of payroll transactions"],"a":0,"e":"Substantive procedures are required for material accounts regardless of risk (AU-C 330.18). With low RMM and predictable relationships, substantive analytics may be sufficient (AU-C 330; AU-C 520)."},{"p":"Situation 4","o":["Respond only at the assertion level for revenue","Overall responses: assign more experienced staff, increase supervision, incorporate unpredictability, and consider performing more procedures at period end rather than interim","Rely more heavily on controls","Reduce materiality to zero"],"a":1,"e":"A weak control environment is a financial statement-level risk that calls for overall responses (AU-C 330.05, .A1–A3)."},{"p":"Situation 5","o":["Confirm with selected distributors the terms of sales, including the absence of side agreements and return rights","Recompute the allowance for doubtful accounts","Vouch sales invoices to the sales journal only","Obtain only a management representation that no side agreements exist"],"a":0,"e":"AU-C 240.A46 lists confirming contract terms and the absence of side agreements as a response to this fraud risk. Representations alone are insufficient."},{"p":"Situation 6","o":["Rely on the controls for the full year with no further work","Obtain evidence about significant changes to the controls after September 30 and determine what additional evidence is needed for the remaining period","Retest all controls at December 31 with full sample sizes","Stop relying on the controls"],"a":1,"e":"AU-C 330.12 requires obtaining evidence about significant changes after the interim period and determining the additional evidence needed for the remaining period."},{"p":"Situation 7","o":["Rely on last year's test because the control is unchanged","Test the operating effectiveness of the control in the current period","Test the control once every third year","Rely on inquiry alone"],"a":1,"e":"Controls that mitigate a significant risk must be tested in the current period if the auditor plans to rely on them. The three-year rotation does not apply (AU-C 330.15)."},{"p":"Situation 8","o":["Decrease the sample sizes for inventory pricing tests","Increase the extent of substantive procedures (for example, larger samples or lower thresholds for investigation) and obtain more persuasive evidence","Perform the same procedures as last year","Shift the procedures to an earlier interim date"],"a":1,"e":"Higher RMM requires more persuasive evidence, such as greater extent, more reliable sources, and timing closer to period end (AU-C 330.07)."}],"ref":"AU-C 330; AU-C 240"},{"a":3,"title":"Accounts Receivable Confirmation Exceptions","instr":"<p>The auditor sent positive confirmations to customers of <b>Stanton Supply Co.</b> as of December 31. For each response in the exhibit, select the most appropriate conclusion.</p>","exhibits":[{"title":"Confirmation Responses","html":"<table><tr><th>Customer</th><th>Response</th></tr><tr><td>1. Avery</td><td>“We mailed a check for the full $5,000 balance on December 30.” Stanton recorded the receipt January 3.</td></tr><tr><td>2. Brooks</td><td>“We returned $3,000 of damaged goods on December 20 and have not received a credit.” Stanton's receiving log shows the return on December 22.</td></tr><tr><td>3. Cole</td><td>“The $8,000 order was received January 4.” Terms are FOB destination; Stanton recorded the sale December 29.</td></tr><tr><td>4. Duran</td><td>“We paid invoice #4410 ($2,200) on November 15.” Stanton shows #4410 unpaid; a $2,200 receipt was posted on Dec 2 to the account of another customer.</td></tr><tr><td>5. Ellis</td><td>“Balance agrees.”</td></tr><tr><td>6. Fong</td><td>“You billed us $12/unit on 500 units; our agreed price is $10/unit.” Stanton's approved price list shows $10.</td></tr><tr><td>7. Grant</td><td>No response after second request.</td></tr></table>"}],"lists":{"cf":["No exception","Timing difference: no misstatement","Misstatement: unrecorded sales return","Misstatement: sales cutoff error","Possible lapping: investigate cash receipts","Misstatement: billing price error","Perform alternative procedures (e.g., subsequent receipts, shipping documents)"]},"rows":[{"p":"Customer 1: Avery","list":"cf","a":1,"e":"Payment in transit at year-end is a timing difference. The receivable was properly outstanding at December 31. Verify the January 3 receipt."},{"p":"Customer 2: Brooks","list":"cf","a":2,"e":"Goods were returned before year-end but no credit was recorded, so receivables and sales are overstated by $3,000."},{"p":"Customer 3: Cole","list":"cf","a":3,"e":"Under FOB destination, the sale occurs on delivery (January 4). Recording it in December is a cutoff error."},{"p":"Customer 4: Duran","list":"cf","a":4,"e":"A receipt posted to another customer's account is a lapping indicator. Expand procedures over cash receipts and consider fraud implications."},{"p":"Customer 5: Ellis","list":"cf","a":0,"e":"Agreement provides evidence of existence."},{"p":"Customer 6: Fong","list":"cf","a":5,"e":"Overbilling of $1,000 (500 × $2) is a pricing error. Consider whether it indicates a control deficiency."},{"p":"Customer 7: Grant","list":"cf","a":6,"e":"Nonresponse to a positive confirmation requires alternative procedures (AU-C 505.12)."}],"ref":"AU-C 505"},{"a":3,"title":"Inventory Procedures and Assertions","instr":"<p>For each procedure performed during the audit of <b>Mallory Manufacturing's</b> inventory, select the <b>primary assertion</b> tested.</p>","exhibits":[{"title":"Procedures","html":"<ol><li>Select items from the warehouse floor and trace them to the count sheets.</li><li>Select items from the final inventory listing and trace them to count tags and then to the floor.</li><li>Examine vendor invoices for a sample of items to verify unit costs used.</li><li>Inspect consignment agreements and confirm goods held by Mallory for others.</li><li>Review the inventory note for disclosure of costing method and pledged inventory.</li><li>Compare subsequent sales prices of slow-moving items to their carrying amounts.</li><li>Obtain the last receiving and shipping document numbers at the count and test transactions around them.</li></ol>"}],"lists":{"as":["Existence","Completeness","Rights and obligations","Accuracy, valuation and allocation","Cutoff","Presentation"]},"rows":[{"p":"Procedure 1","list":"as","a":1,"e":"Floor to records tests that all items on hand are recorded."},{"p":"Procedure 2","list":"as","a":0,"e":"Records to floor tests that recorded items exist."},{"p":"Procedure 3","list":"as","a":3,"e":"Verifying unit costs tests valuation."},{"p":"Procedure 4","list":"as","a":2,"e":"Goods held for others are not owned. This tests rights."},{"p":"Procedure 5","list":"as","a":5,"e":"Disclosure of method and pledges relates to presentation."},{"p":"Procedure 6","list":"as","a":3,"e":"Comparing NRV to cost tests valuation (lower of cost and NRV)."},{"p":"Procedure 7","list":"as","a":4,"e":"Capturing document numbers at the count tests recording in the proper period."}],"ref":"AU-C 501; assertions"},{"a":3,"title":"Search for Unrecorded Liabilities","instr":"<p>Year-end for <b>Marlow Industries</b> is December 31, 20X6. The auditor examined cash disbursements made in January 20X7. None of the items below were recorded in accounts payable or accrued liabilities at December 31 unless stated otherwise. For each item, select whether an adjustment to liabilities is required at December 31, then compute the total.</p>","exhibits":[{"title":"January Disbursements","html":"<table><tr><th>#</th><th>Paid</th><th class='num'>Amount</th><th>Description</th></tr><tr><td>1</td><td>Jan 5</td><         case 'retry': { var qr = self.item(); delete s.answers['m:' + qr.id]; s.fb['m:' + qr.id].last = null; self.save(); self.render(); break; }
        case 'reveal': { var qv = self.item(), fv = s.fb['m:' + qv.id] || (s.fb['m:' + qv.id] = { tries: 0 }); if (fv.first == null) fv.first = false; fv.shown = true; self.save(); self.render(); break; }
        case 'tcheck': case 'treveal': {
          var tt = self.item(), kt = 't:' + tt.id, ft = s.fb[kt] || (s.fb[kt] = {});
          var res = tt.rows.map(function (r, j) { return rowCorrect(tt, r, s.answers[kt + ':' + j]); });
          if (!ft.first) ft.first = res; ft.last = res; if (act === 'treveal') ft.shown = true; self.save(); self.render(); break;
        }
        case 'tretry': {
          var t2 = self.item(), k2 = 't:' + t2.id, f2 = s.fb[k2];
          if (f2 && f2.last) f2.last.forEach(function (ok, j) { if (ok === false) { delete s.answers[k2 + ':' + j]; f2.last[j] = null; } });
          self.save(); self.render(); break;
        }
        case 'prev': self.go(s.idx - 1); break;
        case 'next': self.go(s.idx + 1); break;
        case 'jump': self.go(Number(el.getAttribute('data-i'))); break;
        case 'flag': { var it = self.item(), k = self.itemKey(it, self.cur().kind); if (s.flags[k]) delete s.flags[k]; else s.flags[k] = 1; self.save(); self.render(); break; }
        case 'tab': self.ui.tab = Number(el.getAttribute('data-i')); self.render(); break;
        case 'review': self.ui.modal = 'review'; self.render(); break;
        case 'help': self.ui.modal = 'help'; self.render(); break;
        case 'exit': self.ui.modal = 'exit'; self.render(); break;
        case 'close': self.ui.modal = null; self.render(); break;
        case 'confirmSubmit': self.ui.modal = 'confirm'; self.render(); break;
        case 'submit': self.submitTestlet(); break;
        case 'takeBreak': self.takeBreak(); break;
        case 'endBreak': self.endBreak(); break;
        case 'calc': self.ui.calc = !self.ui.calc; self.render(); break;
        case 'resume': s.paused = false; self.save(); self.render(); break;
        case 'pause': s.paused = true; self.ui.modal = null; self.save(); self.render(); break;
        case 'endNow': self.finish(false); break;
        case 'abandon': self.s = { phase: 'start' }; self.ui.modal = null; self.save(); self.render(); break;
        case 'filter': self.ui.filter = el.getAttribute('data-f'); self.render(); break;
        case 'retake': self.start(s.examId, s.mode, s.drill); break;
        case 'home': self.ui.sel = s.examId || self.ui.sel; self.s = { phase: 'start' }; self.save(); self.render(); break;
      }
    });
    root.addEventListener('contextmenu', function (ev) {
      var el = ev.target.closest('.aud-opt'); if (!el) return; ev.preventDefault();
      var q = self.item(), i = Number(el.getAttribute('data-i')), k = 'm:' + q.id, a = self.s.strikes[k] || [];
      var p = a.indexOf(i); if (p >= 0) a.splice(p, 1); else a.push(i); self.s.strikes[k] = a; self.save(); self.render();
    });
    var onInput = function (ev) {
      var el = ev.target; if (!el.hasAttribute || !el.hasAttribute('data-row')) return;
      var t = self.item(), k = 't:' + t.id + ':' + el.getAttribute('data-row');
      if (el.value === '') delete self.s.answers[k]; else self.s.answers[k] = el.tagName === 'SELECT' ? Number(el.value) : el.value;
      el.classList.toggle('filled', el.value !== '');
      if (self.s.mode === 'study') { var tf = self.s.fb['t:' + t.id], ri = Number(el.getAttribute('data-row')); if (tf && tf.last && !tf.shown) { tf.last[ri] = null; var mk = $(self.root, '[data-mk="' + ri + '"]'); if (mk) mk.innerHTML = ''; } }
      self.save();
    };
    root.addEventListener('change', onInput); root.addEventListener('input', onInput);
    root.addEventListener('keydown', function (ev) {
      var s = self.s; if (s.phase !== 'exam' || s.paused || self.ui.modal) return;
      if (/INPUT|SELECT|TEXTAREA/.test(ev.target.tagName)) return;
      var t = self.cur(); if (!t) return;
      if (ev.key === 'ArrowRight') { self.go(s.idx + 1); ev.preventDefault(); }
      else if (ev.key === 'ArrowLeft') { self.go(s.idx - 1); ev.preventDefault(); }
      else if (/^[fF]$/.test(ev.key)) { var it = self.item(), k = self.itemKey(it, t.kind); if (s.flags[k]) delete s.flags[k]; else s.flags[k] = 1; self.save(); self.render(); }
      else if (t.kind === 'mcq' && /^[a-dA-D]$/.test(ev.key)) { var q = self.item(), i = ev.key.toUpperCase().charCodeAt(0) - 65; if (i < q.o.length) { s.answers['m:' + q.id] = i; if (s.mode === 'study' && s.fb['m:' + q.id] && !s.fb['m:' + q.id].shown) s.fb['m:' + q.id].last = null; self.save(); self.render(); } }
    });
    if (!root.hasAttribute('tabindex')) root.setAttribute('tabindex', '0');
    // drag: calculator + splitter
    root.addEventListener('mousedown', function (ev) {
      var h = ev.target.closest('[data-drag]'), sp = ev.target.closest('[data-split]');
      if (h && !ev.target.closest('button')) {
        var c = h.parentNode, rb = root.getBoundingClientRect(), cb = c.getBoundingClientRect(), dx = ev.clientX - cb.left, dy = ev.clientY - cb.top;
        var mv = function (e) { var x = Math.max(0, Math.min(rb.width - cb.width, e.clientX - rb.left - dx)), y = Math.max(0, Math.min(rb.height - 40, e.clientY - rb.top - dy)); c.style.left = x + 'px'; c.style.top = y + 'px'; c.style.right = 'auto'; self.ui.calcPos = { x: x, y: y }; };
        var up = function () { document.removeEventListener('mousemove', mv); document.removeEventListener('mouseup', up); };
        document.addEventListener('mousemove', mv); document.addEventListener('mouseup', up); ev.preventDefault();
      } else if (sp) {
        var wrap = sp.parentNode, left = sp.previousElementSibling, wb = wrap.getBoundingClientRect();
        var mv2 = function (e) { var p = Math.max(20, Math.min(80, (e.clientX - wb.left) / wb.width * 100)); left.style.flexBasis = p + '%'; self.ui.split = p; };
        var up2 = function () { document.removeEventListener('mousemove', mv2); document.removeEventListener('mouseup', up2); };
        document.addEventListener('mousemove', mv2); document.addEventListener('mouseup', up2); ev.preventDefault();
      }
    });
    // long-press strikeout for touch
    var lp; root.addEventListener('touchstart', function (ev) { var el = ev.target.closest('.aud-opt'); if (!el) return; lp = setTimeout(function () { el.dispatchEvent(new MouseEvent('contextmenu', { bubbles: true, cancelable: true })); }, 600); }, { passive: true });
    root.addEventListener('touchend', function () { clearTimeout(lp); });
  };

  Exam.prototype.afterRender = function () { var b = $(this.root, '.aud-body'); if (b && this._lastPos !== this.s.testlet + ':' + this.s.idx) { b.scrollTop = 0; this._lastPos = this.s.testlet + ':' + this.s.idx; } };
  Exam.prototype.destroy = function () { clearInterval(this.tick); this.root.innerHTML = ''; };

  global.AUDExam = {
    config: CFG, areas: AREAS,
    mount: function (el, opts) { return new Exam(el, opts); },
    exams: function () { return buildExams(); },
    _grade: { rowCorrect: rowCorrect }
  };
})(typeof window !== 'undefined' ? window : this);


AUDExam.mount(document.getElementById('aud'), { defaultMode: 'study' });
