<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CPA Audit Mock Exam Suite — CL</title>
<style>html,body{margin:0;height:100%;background:#eef1f5}#aud{height:100vh}
/* AUD Mock Exam — scoped styles (everything lives under .aud-root) */
.aud-root{--navy:#13294b;--navy2:#1d3a66;--bar:#e8ecf1;--line:#c9d1db;--ink:#1d2733;--muted:#5b6876;--blue:#1565c0;--blue2:#0d47a1;--flag:#e67e22;--ok:#1e8e3e;--bad:#c62828;--bg:#f5f7fa;
  font-family:Arial,"Helvetica Neue",Helvetica,sans-serif;font-size:15px;color:var(--ink);background:#fff;position:relative;display:flex;flex-direction:column;min-height:640px;height:100%;border:1px solid var(--line);box-sizing:border-box;overflow:hidden}
.aud-root *,.aud-root *::before,.aud-root *::after{box-sizing:border-box}
.aud-root.aud-full{position:fixed;inset:0;z-index:9999;border:0;height:100vh}
.aud-root button{font:inherit;cursor:pointer}
.aud-root table{border-collapse:collapse}

/* header */
.aud-hdr{background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:0 12px;height:46px;flex:none}
.aud-hdr .aud-title{font-weight:bold;letter-spacing:.3px;white-space:nowrap}
.aud-hdr .aud-testlet{opacity:.9;font-size:13px;white-space:nowrap}
.aud-hdr .aud-spacer{flex:1}
.aud-tool{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:3px;padding:5px 10px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.aud-tool:hover{background:rgba(255,255,255,.12)}
.aud-timer{font-family:"Courier New",monospace;font-size:17px;font-weight:bold;background:rgba(0,0,0,.25);padding:5px 10px;border-radius:3px;white-space:nowrap}
.aud-timer.warn{background:#b71c1c}
.aud-timer small{font-family:Arial,sans-serif;font-size:11px;font-weight:normal;opacity:.8;margin-right:6px}

/* sub bar */
.aud-sub{background:var(--bar);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:6px 12px;flex:none;font-size:14px}
.aud-sub .aud-qof{font-weight:bold}
.aud-nav-btn{background:#fff;border:1px solid var(--line);border-radius:3px;padding:3px 10px}
.aud-nav-btn:disabled{opacity:.4;cursor:default}
.aud-flag{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:3px;padding:3px 10px}
.aud-flag.on{background:#fff3e0;border-color:var(--flag);color:#a04d00;font-weight:bold}
.aud-flag svg{width:14px;height:14px}

/* body */
.aud-body{flex:1;overflow:auto;background:#fff;position:relative}
.aud-mcq{max-width:900px;margin:0 auto;padding:26px 28px 40px}
.aud-stem{line-height:1.55;margin-bottom:20px}
.aud-stem table{margin:10px 0;font-size:14px}
.aud-stem td,.aud-stem th{border:1px solid var(--line);padding:4px 10px;text-align:left}
.aud-opts{list-style:none;margin:0;padding:0}
.aud-opt{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border:1px solid transparent;border-radius:4px;margin-bottom:6px;cursor:pointer;line-height:1.45;user-select:none}
.aud-opt:hover{background:#f1f5fb;border-color:#dbe4f0}
.aud-opt.sel{background:#e3eefc;border-color:#90b4e6}
.aud-opt.strike .aud-opt-txt{text-decoration:line-through;color:#98a2ad}
.aud-opt input{margin-top:3px;accent-color:var(--blue)}
.aud-opt-letter{font-weight:bold;min-width:18px}
.aud-hint{font-size:12px;color:var(--muted);margin-top:18px}

/* TBS split */
.aud-tbs{display:flex;height:100%;min-height:480px}
.aud-pane{overflow:auto;height:100%}
.aud-left{flex:0 0 50%;border-right:1px solid var(--line);background:var(--bg);display:flex;flex-direction:column}
.aud-split{flex:0 0 6px;cursor:col-resize;background:var(--bar);border-right:1px solid var(--line)}
.aud-right{flex:1;padding:18px 22px 40px}
.aud-tabs{display:flex;flex-wrap:wrap;gap:2px;padding:8px 8px 0;background:var(--bar);border-bottom:1px solid var(--line);flex:none}
.aud-tab{border:1px solid var(--line);border-bottom:0;background:#dde3ea;padding:6px 12px;font-size:13px;border-radius:4px 4px 0 0}
.aud-tab.on{background:#fff;font-weight:bold}
.aud-exhibit{padding:16px 18px;background:#fff;flex:1;overflow:auto;line-height:1.5;font-size:14px}
.aud-exhibit table{width:100%;margin:8px 0;font-size:13px}
.aud-exhibit td,.aud-exhibit th{border:1px solid var(--line);padding:4px 8px;text-align:left;vertical-align:top}
.aud-exhibit th{background:#eef2f7}
.aud-exhibit .num,.aud-stem .num{text-align:right;font-variant-numeric:tabular-nums}
.aud-instr{background:#f3f7fc;border:1px solid #d5e2f2;border-radius:4px;padding:12px 14px;margin-bottom:16px;line-height:1.5;font-size:14px}
.aud-instr h3{margin:0 0 6px;font-size:16px}
.aud-resp{width:100%;font-size:14px}
.aud-resp th{background:var(--navy2);color:#fff;text-align:left;padding:7px 8px;font-weight:normal}
.aud-resp td{border:1px solid var(--line);padding:7px 8px;vertical-align:top;line-height:1.4}
.aud-resp td:first-child{width:34px;text-align:center;color:var(--muted)}
.aud-resp td.aud-cell{width:42%}
.aud-resp select,.aud-resp input{width:100%;padding:5px 6px;border:1px solid #9fb0c3;border-radius:3px;font:inherit;font-size:13px;background:#fff}
.aud-resp select.filled,.aud-resp input.filled{background:#eef5ff;border-color:var(--blue)}

/* footer */
.aud-ftr{background:var(--bar);border-top:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:8px 12px;flex:none}
.aud-btn{background:var(--blue);color:#fff;border:1px solid var(--blue2);border-radius:3px;padding:7px 16px;font-size:14px}
.aud-btn:hover{background:var(--blue2)}
.aud-btn.sec{background:#fff;color:var(--ink);border-color:var(--line)}
.aud-btn.sec:hover{background:#f0f3f7}
.aud-btn.warn{background:#ad1457;border-color:#880e4f}
.aud-btn:disabled{opacity:.45;cursor:default}

/* modal */
.aud-modal-bg{position:absolute;inset:0;background:rgba(10,20,35,.45);display:flex;align-items:center;justify-content:center;z-index:50}
.aud-modal{background:#fff;border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.3);width:min(720px,94%);max-height:88%;display:flex;flex-direction:column}
.aud-modal-h{background:var(--navy);color:#fff;padding:10px 16px;border-radius:6px 6px 0 0;font-weight:bold;display:flex;justify-content:space-between;align-items:center}
.aud-modal-h button{background:none;border:0;color:#fff;font-size:20px;line-height:1}
.aud-modal-b{padding:16px;overflow:auto;line-height:1.5}
.aud-modal-f{padding:10px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}

/* review grid */
.aud-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;margin-bottom:12px}
.aud-legend span{display:inline-flex;align-items:center;gap:6px}
.aud-sw{width:14px;height:14px;border-radius:2px;border:1px solid var(--line);display:inline-block}
.aud-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px}
.aud-cellq{position:relative;border:1px solid var(--line);border-radius:3px;background:#fff;height:40px;font-weight:bold;font-size:14px}
.aud-cellq.ans{background:#dbe9fb;border-color:#8fb3e3}
.aud-cellq.part{background:linear-gradient(135deg,#dbe9fb 50%,#fff 50%)}
.aud-cellq.cur{outline:2px solid var(--navy);outline-offset:1px}
.aud-cellq .f{position:absolute;top:-6px;right:-6px;width:16px;height:16px;background:var(--flag);border-radius:50%;color:#fff;font-size:10px;line-height:16px}
.aud-tstat{display:flex;gap:18px;font-size:13px;color:var(--muted);margin-top:12px}

/* calculator */
.aud-calc{position:absolute;top:70px;right:30px;width:244px;background:#eef1f5;border:1px solid #8a97a8;border-radius:6px;box-shadow:0 8px 28px rgba(0,0,0,.25);z-index:60;user-select:none}
.aud-calc-h{background:var(--navy);color:#fff;font-size:13px;padding:6px 10px;border-radius:6px 6px 0 0;cursor:move;display:flex;justify-content:space-between}
.aud-calc-h button{background:none;border:0;color:#fff;font-size:16px;line-height:1}
.aud-calc-d{margin:8px;background:#fff;border:1px solid #9aa6b5;border-radius:3px;text-align:right;padding:6px 8px;font-family:"Courier New",monospace;font-size:20px;min-height:40px;overflow:hidden;white-space:nowrap}
.aud-calc-d small{display:block;font-size:11px;color:var(--muted);min-height:13px}
.aud-calc-k{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:0 8px 8px}
.aud-calc-k button{height:34px;border:1px solid #9aa6b5;border-radius:3px;background:#fff;font-size:14px}
.aud-calc-k button.op{background:#dfe6ef}
.aud-calc-k button.eq{background:var(--blue);color:#fff;border-color:var(--blue2)}
.aud-calc-k button:active{transform:translateY(1px)}

/* start / break / results */
.aud-page{max-width:980px;margin:0 auto;padding:28px 26px 50px;line-height:1.55}
.aud-page h1{font-size:24px;margin:0 0 4px;color:var(--navy)}
.aud-page h2{font-size:18px;margin:26px 0 10px;color:var(--navy)}
.aud-muted{color:var(--muted)}
.aud-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin:16px 0}
.aud-card{border:1px solid var(--line);border-radius:6px;padding:14px;background:#fff;text-align:left}
.aud-card:hover{border-color:var(--blue);box-shadow:0 2px 10px rgba(21,101,192,.12)}
.aud-card.on{border-color:var(--blue);background:#f1f6fd;box-shadow:inset 0 0 0 1px var(--blue)}
.aud-card b{display:block;font-size:16px;color:var(--navy)}
.aud-card span{font-size:12px;color:var(--muted)}
.aud-info{width:100%;font-size:14px;margin:8px 0}
.aud-info td,.aud-info th{border:1px solid var(--line);padding:6px 10px;text-align:left}
.aud-info th{background:#eef2f7}
.aud-score{display:flex;gap:18px;flex-wrap:wrap;align-items:stretch;margin:18px 0}
.aud-big{flex:0 0 220px;border-radius:8px;padding:18px;text-align:center;color:#fff}
.aud-big.pass{background:var(--ok)}
.aud-big.fail{background:var(--bad)}
.aud-big .n{font-size:54px;font-weight:bold;line-height:1}
.aud-big .l{font-size:13px;opacity:.9}
.aud-big .s{margin-top:8px;font-size:20px;font-weight:bold;letter-spacing:1px}
.aud-stats{flex:1;min-width:260px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.aud-stat{border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.aud-stat b{font-size:22px;color:var(--navy);display:block}
.aud-stat span{font-size:12px;color:var(--muted)}
.aud-bar{height:10px;background:#e6eaf0;border-radius:5px;overflow:hidden;margin-top:4px}
.aud-bar i{display:block;height:100%;background:var(--blue)}
.aud-bar i.low{background:var(--bad)}
.aud-filter{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 14px}
.aud-chip{border:1px solid var(--line);background:#fff;border-radius:14px;padding:4px 12px;font-size:13px}
.aud-chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.aud-key{border:1px solid var(--line);border-radius:6px;margin-bottom:14px;overflow:hidden}
.aud-key-h{display:flex;gap:10px;align-items:center;padding:8px 12px;background:#f3f6fa;border-bottom:1px solid var(--line);font-size:13px;flex-wrap:wrap}
.aud-key-h .res{font-weight:bold}
.aud-key-h .res.ok{color:var(--ok)}
.aud-key-h .res.no{color:var(--bad)}
.aud-key-b{padding:12px 14px;line-height:1.5}
.aud-ko{border-left:4px solid #d4dae2;padding:7px 10px;margin:6px 0;background:#fafbfc;font-size:14px}
.aud-ko.correct{border-left-color:var(--ok);background:#edf7ef}
.aud-ko.picked{border-left-color:var(--bad);background:#fdeeee}
.aud-ko .why{display:block;color:#3d4955;font-size:13px;margin-top:3px}
.aud-tag{display:inline-block;font-size:11px;border-radius:3px;padding:1px 6px;background:#e3e8ef;color:#384656}
.aud-tag.g{background:#d7f0dc;color:#1e6b33}
.aud-tag.r{background:#fbdcdc;color:#8e1d1d}
.aud-tag.o{background:#ffe8cc;color:#8a4500}
.aud-ref{font-size:12px;color:var(--muted);margin-top:8px}
.aud-row-ok{color:var(--ok);font-weight:bold}
.aud-row-no{color:var(--bad);font-weight:bold}
details.aud-ex summary{cursor:pointer;color:var(--blue);font-size:13px;margin:6px 0}
@media (max-width:760px){.aud-tbs{flex-direction:column}.aud-left{flex:none;max-height:45vh;border-right:0;border-bottom:1px solid var(--line)}.aud-split{display:none}.aud-hdr .aud-testlet{display:none}.aud-tool .lbl{display:none}}

/* CL provenance badge (differentiator) */
.aud-cl{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:22px;padding:0 6px;border-radius:4px;background:#d97757;color:#fff;font-weight:bold;font-size:12px;letter-spacing:.5px;flex:none}
.aud-brandline{font-size:12px;color:var(--muted)}
@media (max-width:760px){.aud-brandline{display:none}}

/* pacing coach */
.aud-pace{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:5px 12px;font-size:13px;border-bottom:1px solid var(--line);background:#f1f8f2;flex:none}
.aud-pace.mid{background:#fff8e6}.aud-pace.bad{background:#fdecec}
.aud-pace-bars{position:relative;width:180px;height:10px;background:#e3e8ee;border-radius:5px;overflow:hidden}
.aud-pace-bars i{position:absolute;left:0;height:5px;display:block}
.aud-pace-bars i.t{top:0;background:#8a97a8}.aud-pace-bars i.d{bottom:0;background:var(--ok)}
.aud-pace.ok .aud-pace-s{color:var(--ok)}.aud-pace.mid .aud-pace-s{color:#a15c00}.aud-pace.bad .aud-pace-s{color:var(--bad)}
.aud-nudge{background:#e67e22;color:#fff;border-radius:3px;padding:2px 8px;font-weight:bold}

/* study mode feedback */
.aud-fb{margin-top:14px;padding:12px 14px;border:1px solid var(--line);border-radius:6px;background:#f7f9fc;line-height:1.5}
.aud-fb.ok{background:#edf7ef;border-color:#9fd3ab}.aud-fb.no{background:#fdeeee;border-color:#efb0b0}
.aud-fb.show{background:#fff}
.aud-fb .why{font-size:14px;color:#3d4955;margin:6px 0 8px}
.aud-rowans{margin-top:6px;font-size:13px;background:#f3f7fc;border-left:3px solid var(--ok);padding:5px 8px}
.aud-rowans .why{color:#3d4955;margin-top:3px}
.aud-mk{display:block;font-size:12px;margin-top:4px}
.site-hdr{display:flex;align-items:center;justify-content:space-between;height:56px;padding:0 20px;background:#13294b;border-bottom:4px solid #5b8fd6;font-family:system-ui,sans-serif;box-sizing:border-box}
.site-brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-weight:700;font-size:17px}
.site-logo{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;background:#e8eef8;color:#13294b;font-weight:700}
.site-badge{background:#d97757;color:#fff;border-radius:6px;padding:2px 7px;font-size:13px}
.site-link{color:#fff;font-size:15px}
#aud{height:calc(100vh - 56px)!important}
</style>
</head>

<header class="site-hdr"><a class="site-brand" href="https://amandeeparora.com/projects/"><span class="site-logo">A</span>CPA Audit Mock Exam Suite <span class="site-badge">CL</span></a><a class="site-link" href="https://amandeeparora.com/projects/">Portfolio demos</a></header>

<script>
(window.AUD_DATA = window.AUD_DATA || []).push({
exam: 6, title: "AUD Hard Exam (AICPA-style)", tag: "HARD",
mcq: [
// ---------- AREA I (16) ----------
{a:1,q:"Before Larkin Bank became an attest client, a covered member obtained a home mortgage from Larkin under normal lending terms. This year, the covered member renegotiated the mortgage with Larkin to extend the term and lower the rate, terms not available to the general public. Which statement is correct?",
o:["Independence is not impaired because home mortgages are grandfathered loans.","Independence is impaired, because the grandfathered status is lost when the loan is renegotiated after the client became an attest client on terms that were not normal.","Independence is impaired only if the mortgage is material to the covered member.","Independence is not impaired if the covered member continues to make timely payments."],
c:1,r:["Grandfathered status requires that the loan remain current under its original terms and not be renegotiated to new terms after the lender becomes an attest client.","Correct. Under ET 1.260.020, grandfathered loans must be kept current under their original terms. A renegotiation that changes the terms after the lender becomes an attest client creates a new loan from an attest client, which impairs independence (and the preferential terms are an additional problem).","Loans from attest clients do not depend on materiality to the covered member.","Timely payment is necessary but does not cure the renegotiation."],ref:"ET 1.260.020"},
{a:1,q:"A covered member on the engagement team inherits shares of an attest client from a relative's estate. The covered member did not solicit the interest. To avoid impairing independence, the covered member must:",
o:["Dispose of the shares by the end of the attest engagement.","Dispose of the interest as soon as practicable, but no later than 30 days after the covered member has knowledge of and the right to dispose of it.","Place the shares in a blind trust.","Disclose the shares in the auditor's report."],
c:1,r:["The deadline is specific, not the end of the engagement.","Correct. The Code's unsolicited financial interests interpretation (ET 1.240) requires disposal as soon as practicable, but no later than 30 days after the covered member has knowledge of the interest and the right to dispose of it.","A blind trust does not eliminate a direct interest held by a covered member.","Disclosure does not cure impairment."],ref:"AICPA Code, Unsolicited Financial Interests (ET 1.240)"},
{a:1,q:"Ortiz is a partner in the same office as the lead attest partner for Bellamy Co. Ortiz performs no services for Bellamy and owns 50 shares (immaterial) of Bellamy stock. Which statement is correct?",
o:["Independence is not impaired because Ortiz provides no services to Bellamy.","Independence is not impaired because the interest is immaterial.","Independence is impaired because Ortiz is a covered member and any direct financial interest impairs independence.","Independence is impaired only if Ortiz could influence the engagement."],
c:2,r:["Office location alone makes a partner a covered member.","Direct financial interests held by covered members impair independence regardless of materiality.","Correct. Partners in the office of the lead attest engagement partner are covered members (ET 0.400.12), and any direct financial interest impairs independence.","Ability to influence is a separate covered-member category. Office location is sufficient here."],ref:"ET 0.400.12; ET 1.240.010"},
{a:1,q:"A covered member owns a material investment in Holdco. Holdco has significant influence over Gamma Corp., the firm's audit client, and Gamma is material to Holdco. Under the AICPA Code, the covered member's investment in Holdco:",
o:["Does not affect independence because Holdco is not the attest client.","Impairs independence because Holdco is an affiliate of the financial statement attest client.","Impairs independence only if Holdco's shares are publicly traded.","Impairs independence only if the covered member is on Gamma's board."],
c:1,r:["The Code extends independence to certain affiliates.","Correct. An entity that has significant influence over the attest client, when the client is material to that entity, is an affiliate (ET 0.400.02). Covered members must be independent of affiliates for these purposes.","Public trading status is irrelevant.","Board service is not required for the impairment."],ref:"ET 1.224.010; ET 0.400.02"},
{a:1,q:"Under SEC independence rules, which arrangement impairs the firm's independence with respect to an issuer audit client?",
o:["The audit partner's compensation is based in part on audit quality metrics.","The audit partner earns compensation based on selling tax consulting services to that audit client.","The firm's profits include fees from permitted services provided to the client.","The audit partner receives a salary increase for client retention."],
c:1,r:["Quality-based compensation is permitted.","Correct. SEC Rule 2-01(c)(8) states that an accountant is not independent if any audit partner earns or receives compensation based on selling services other than audit, review, or attest services to that audit client.","Firm-level profits from permitted services do not impair independence.","Retention-based raises are not the prohibited arrangement, unless tied to selling nonaudit services."],ref:"SEC Rule 2-01(c)(8)"},
{a:1,q:"A staff auditor charged 8 hours to the prior-year audit of Quanta Corp., an issuer, then left the firm and became Quanta's controller (a financial reporting oversight role) two months later. Under the SEC's cooling-off rule:",
o:["The firm's independence is impaired because any former engagement team member triggers the cooling-off period.","The firm's independence is not impaired because the individual provided 10 or fewer hours of audit services.","Independence is impaired only if the individual was a manager.","Independence is impaired for two years."],
c:1,r:["The rule has a 10-hour threshold.","Correct. SEC Rule 2-01(c)(2)(iii)(B) applies to members of the audit engagement team who provided more than 10 hours of audit, review, or attest services. 8 hours is below the threshold.","Rank is not the test.","The period is one year when it applies."],ref:"SEC Rule 2-01(c)(2)(iii)"},
{a:1,q:"A service auditor is engaged to perform a SOC 1 Type 2 examination for Ledgerline, a payroll service organization with 300 user entities. With respect to whom must the service auditor be independent?",
o:["Ledgerline and all 300 user entities.","Ledgerline (the service organization) only; independence from the user entities is not required.","Only the user entities whose auditors will use the report.","Neither, because SOC 1 reports are restricted use."],
c:1,r:["The Code and AT-C 320 do not require independence from each user entity.","Correct. The service auditor must be independent of the service organization. Independence from user entities is not required.","User auditors' use of the report does not create an independence requirement.","Use restrictions do not eliminate the independence requirement for an attestation engagement."],ref:"AT-C 320; AT-C 105"},
{a:1,q:"An accountant is engaged to perform a preparation engagement (AR-C 70) for a client in which the accountant's spouse owns a material direct financial interest. Which statement is correct?",
o:["The accountant may not perform the engagement because independence is required.","The accountant may perform the engagement and is not required to determine independence or disclose a lack of it.","The accountant must disclose the lack of independence on each page of the financial statements.","The accountant must issue a compilation report disclosing the lack of independence."],
c:1,r:["Independence is not required for preparation engagements.","Correct. AR-C 70 does not require the accountant to determine independence, and no report is issued.","The required legend is “no assurance is provided,” not an independence statement.","A preparation engagement does not result in a report."],ref:"AR-C 70"},
{a:1,q:"In a GAGAS financial audit, a small city asks the audit organization to prepare its government-wide financial statements from the city's adjusted trial balance. Under the 2024 revision of Government Auditing Standards:",
o:["The service is prohibited in all circumstances.","The service can be provided if the auditor determines management has the SKE to oversee it, evaluates the significance of threats (including self-review), applies safeguards as necessary, and documents the evaluation.","The service is permitted without any documentation if management approves the statements.","The service is permitted only if the city's expenditures are under $1 million."],
c:1,r:["GAGAS does not prohibit preparing financial statements from a client-provided trial balance.","Correct. GAGAS treats preparing financial statements as a nonaudit service creating threats that must be evaluated and, if significant, reduced through safeguards, with documentation.","Documentation of the threat evaluation and safeguards is required.","No dollar threshold applies."],ref:"GAGAS (2024) Ch. 3"},
{a:1,q:"Under SQMS No. 1, which individual should NOT be assigned to perform the inspection of a completed audit engagement as part of the firm's monitoring activities?",
o:["A partner from another office with appropriate competence.","An individual who was a member of the engagement team or the engagement quality reviewer on that engagement.","An external individual engaged by the firm.","A senior manager in the national quality office."],
c:1,r:["Competent, objective partners may perform inspections.","Correct. SQMS No. 1 requires that individuals performing inspections of completed engagements are not members of the engagement team or the engagement quality reviewer for that engagement, to preserve objectivity.","External individuals may be used.","National office personnel may be used if objective."],ref:"SQMS No. 1 (QM 10), monitoring"},
{a:1,q:"In March 20X5, a CPA agreed to perform a cost-segregation study for Harbor Co. for a fee equal to 20% of the tax savings. In July 20X5, Harbor engaged the CPA to audit its December 31, 20X5 financial statements, and the contingent fee was received in October 20X5. Which statement is correct under the AICPA Code?",
o:["There is no violation because the contingent fee arrangement was entered into before the audit engagement.","The CPA violated the Contingent Fees Rule, because a contingent fee was received from a client during the period of an audit engagement and the period covered by the audited financial statements.","There is a violation only if the fee is material to the CPA.","There is no violation because a cost-segregation study is not a tax return."],
c:1,r:["The rule looks at when services are performed or fees are received relative to the audit periods, not only when the arrangement was made.","Correct. ET 1.510.001 prohibits performing services for, or receiving, a contingent fee from a client during the period the member is engaged to perform an audit (or review, certain compilations, or an examination of prospective financial information) and the period covered by the historical financial statements involved.","Materiality is irrelevant to the rule.","For audit clients, the prohibition covers any professional service, not just tax returns."],ref:"ET 1.510.001"},
{a:1,q:"Which statement best distinguishes professional skepticism from professional judgment?",
o:["They are identical concepts.","Professional skepticism is an attitude involving a questioning mind and critical assessment of evidence; professional judgment is the application of relevant training, knowledge, and experience in making informed decisions about appropriate courses of action.","Professional judgment applies only to materiality; skepticism applies only to fraud.","Skepticism is required only when fraud risk factors exist."],
c:1,r:["AU-C 200 defines them separately.","Correct. These are the AU-C 200 definitions. Skepticism enhances the quality of judgment.","Both apply throughout the audit.","Skepticism is required on every audit."],ref:"AU-C 200.14"},
{a:1,q:"Midway through an audit, management requests that the engagement be changed to a review because the auditor has requested legal counsel confirmations that management refuses to authorize. Under AU-C 210, the auditor should:",
o:["Agree to the change because a review is a lower level of service.","Not agree to the change, because management's restriction on scope is not a reasonable justification; if not permitted to continue the audit, the auditor should withdraw when possible and consider communication to TCWG and other obligations.","Agree to the change and refer to the original audit engagement in the review report.","Agree to the change and issue a qualified review conclusion."],
c:1,r:["A request to avoid a scope limitation is not a reasonable justification.","Correct. AU-C 210.14–.16 indicate that a change resulting from scope restrictions imposed by management is generally not reasonable. The auditor should not agree and should consider withdrawal and communication.","Even when a change is justified, the report would not reference the original engagement.","The change itself is inappropriate here."],ref:"AU-C 210.14–.17"},
{a:1,q:"An auditor concludes that, in rare circumstances, a presumptively mandatory requirement (indicated by “should”) in a relevant AU-C section would be ineffective in achieving its intent. The auditor:",
o:["May ignore the requirement without further action.","Should perform alternative audit procedures to achieve the intent of that requirement and document the justification for the departure and how the alternative procedures achieve its intent.","Must withdraw from the engagement.","Must disclose the departure in the auditor's report."],
c:1,r:["Departures must be justified and documented with alternative procedures.","Correct. AU-C 200.25 and AU-C 230.19 permit departure in rare circumstances, with alternative procedures and documentation.","Withdrawal is not required.","Report disclosure is not required."],ref:"AU-C 200.25; AU-C 230.19"},
{a:1,q:"During the audit, the auditor discovers that a warehouse clerk has stolen inventory worth $4,000, which is clearly immaterial. Management was unaware. Under AU-C 240, the auditor should:",
o:["Take no action because the amount is immaterial.","Communicate the matter on a timely basis to an appropriate level of management (at least one level above those involved).","Report the matter directly to law enforcement.","Communicate the matter only in the auditor's report."],
c:1,r:["Fraud must be communicated to management even if inconsequential.","Correct. AU-C 240.39 requires communicating identified fraud to the appropriate level of management. Fraud involving senior management, or fraud causing material misstatement, would also go to TCWG.","Reporting to authorities is not a GAAS requirement.","Fraud is not reported in the auditor's report."],ref:"AU-C 240.39"},
{a:1,q:"Under AU-C 220 (SAS 146), if the engagement partner becomes aware of a threat to independence that has not been reduced to an acceptable level, the engagement partner should:",
o:["Continue the engagement and disclose the threat in the report.","Take appropriate action, which may include eliminating the circumstance creating the threat or withdrawing from the engagement where withdrawal is possible under applicable law or regulation, and communicate as required by the firm's policies.","Ignore it if the engagement quality reviewer agrees.","Refer the matter to the client's audit committee for resolution."],
c:1,r:["Report disclosure does not address impaired independence.","Correct. AU-C 220 requires the engagement partner to take appropriate action, including elimination of the threat or withdrawal.","An EQR's agreement does not resolve the threat.","Resolution is the firm's and engagement partner's responsibility."],ref:"AU-C 220 (SAS 146)"},
// ---------- AREA II (22) ----------
{a:2,q:"Under COSO 2013, the principle that “the organization deploys control activities through policies that establish what is expected and procedures that put policies into action” belongs to which component?",
o:["Control environment","Risk assessment","Control activities","Monitoring activities"],
c:2,r:["The control environment principles address integrity, oversight, structure, competence, and accountability.","Risk assessment principles address objectives, risks, fraud, and change.","Correct. This is Principle 12, the third principle of control activities (alongside 10 and 11).","Monitoring principles are 16 and 17."],ref:"COSO 2013 Principle 12"},
{a:2,q:"An internal audit team identified an ineffective account reconciliation control in March. The finding was not communicated to the controller until November, after a material misstatement occurred. Which COSO principle was most directly not present and functioning?",
o:["Principle 8: assesses fraud risk.","Principle 17: evaluates and communicates deficiencies in a timely manner to those responsible for corrective action.","Principle 4: commitment to competence.","Principle 13: uses relevant information."],
c:1,r:["Fraud risk is not implicated by the facts.","Correct. The delay in communicating an identified deficiency is a failure of Principle 17 (monitoring).","Competence of the reconciler is not the main issue.","The information existed. Communicating it was the failure."],ref:"COSO 2013 Principle 17"},
{a:2,q:"Which of the following is a <b>preventive</b> control rather than a detective control?",
o:["Monthly bank reconciliation prepared by an employee independent of cash handling.","System configuration requiring purchase orders over $25,000 to be approved electronically by the purchasing director before they can be released to vendors.","Review of a monthly exception report of payroll changes.","Periodic physical inventory counts compared to perpetual records."],
c:1,r:["Reconciliations detect errors after they occur.","Correct. A required approval before the transaction is executed prevents unauthorized purchases.","Reviewing exception reports is detective.","Counts compared to records detect discrepancies."],ref:"COSO 2013; AU-C 315"},
{a:2,q:"Which of the following is NOT considered an inherent limitation of internal control?",
o:["Human error in judgment or simple mistakes.","Collusion among two or more people.","Management override of controls.","The use of automated application controls."],
c:3,r:["Human error is an inherent limitation.","Collusion is an inherent limitation.","Management override is an inherent limitation.","Correct. Automated controls are a type of control, not an inherent limitation (although IT introduces its own risks)."],ref:"AU-C 315; COSO 2013"},
{a:2,q:"The auditor concludes that ITGCs over access to programs and data are not designed effectively for the revenue application, and developers have unrestricted production access. The auditor planned to rely on an automated revenue recognition control. The auditor should most likely:",
o:["Rely on the automated control based on a single test, since automated controls operate consistently.","Recognize that reliance on the automated control cannot be supported by a test of one; consider testing the control directly over the period, testing compensating controls, or not relying and increasing substantive procedures.","Ignore ITGCs because they do not affect financial statement assertions.","Issue a disclaimer of opinion."],
c:1,r:["The “test of one” approach depends on effective ITGCs.","Correct. Ineffective ITGCs undermine the assumption that automated controls operated consistently throughout the period.","ITGCs support the continued effectiveness of application controls.","A disclaimer is not necessary if alternative evidence can be obtained."],ref:"AU-C 315 (SAS 145); AU-C 330"},
{a:2,q:"According to the AICPA Guide to Audit Data Analytics, which statement about the use of audit data analytics (ADAs) is correct?",
o:["An ADA can only be a substantive analytical procedure.","Depending on its design and purpose, an ADA may be used as a risk assessment procedure, a test of controls, a substantive procedure, or in forming an overall conclusion.","ADAs eliminate the need to evaluate the reliability of the underlying data.","ADAs performed on 100% of a population always provide sufficient appropriate evidence for all assertions."],
c:1,r:["ADAs serve multiple purposes.","Correct. The ADA Guide describes ADAs as usable across the audit, depending on their purpose and design.","The reliability of data must be evaluated (AU-C 500.09).","Testing all items for certain attributes does not address every assertion (for example, completeness or valuation)."],ref:"AICPA Guide to Audit Data Analytics"},
{a:2,q:"The auditor plans to run an ADA on a complete sales transaction file extracted by the client's IT department. Before relying on the ADA results, the auditor most importantly should:",
o:["Ask the IT department to sign a representation that the file is accurate.","Evaluate the reliability of the data, for example by reconciling the extracted data to the general ledger and testing completeness and accuracy of the extraction (or controls over it).","Run the ADA twice to see whether results are consistent.","Use only the most recent month's data."],
c:1,r:["Representations do not establish reliability.","Correct. AU-C 500.09 and the ADA Guide require evaluating the relevance and reliability of data, including its completeness and accuracy.","Repeating the analysis does not test data integrity.","Limiting the period reduces coverage without addressing reliability."],ref:"AU-C 500.09; AICPA ADA Guide"},
{a:2,q:"An auditor wants to test the <b>completeness</b> of recorded sales using sampling. Which population is most appropriate to sample from?",
o:["Entries in the sales journal.","The population of prenumbered shipping documents (bills of lading).","The accounts receivable subsidiary ledger.","Customer remittances received after year-end."],
c:1,r:["Sampling recorded entries tests occurrence.","Correct. To test completeness, the sample must be selected from a population that should all be recorded, such as shipping documents, and traced to the records.","AR ledger items are already recorded.","Remittances relate to existence and valuation of receivables."],ref:"AU-C 530; AU-C 500"},
{a:2,q:"In monetary unit sampling, the sampling unit is:",
o:["The individual customer account.","Each individual dollar in the population, with the logical unit containing the selected dollar being examined.","The invoice line item.","Each stratum of the population."],
c:1,r:["Accounts are logical units, not sampling units.","Correct. In MUS, every dollar has an equal chance of selection, and the account containing the selected dollar is audited.","Line items may be logical units.","Strata are used in classical variables sampling."],ref:"AICPA Audit Sampling Guide"},
{a:2,q:"Which of the following procedures constitutes <b>audit sampling</b> under AU-C 530?",
o:["Examining all accounts receivable balances over $50,000 and none below.","Selecting 60 items at random from the population of 12,000 cash disbursements to test approval, and projecting the results to the population.","Performing a walkthrough of one transaction.","Using an ADA to test 100% of journal entries for specific characteristics."],
c:1,r:["Selecting specific items without projecting to the remainder is not sampling.","Correct. Audit sampling applies procedures to less than 100% of a population such that all units have a chance of selection, to draw conclusions about the entire population.","A walkthrough is not designed to draw conclusions about a population.","Testing 100% of a population is not sampling."],ref:"AU-C 530.05"},
{a:2,q:"An auditor assessed control risk below the maximum for the occurrence of purchases based on the design and implementation of controls, but has not yet tested operating effectiveness. Which statement is correct?",
o:["The assessment is appropriate because the controls are well designed.","Assessing control risk below maximum requires evidence about operating effectiveness; without tests of controls, control risk should be assessed at maximum.","Design and implementation testing provides the same evidence as operating effectiveness testing.","Control risk can be assessed low without tests if prior-year tests were satisfactory."],
c:1,r:["Design evidence is insufficient for reliance.","Correct. SAS 145 requires testing operating effectiveness to support a control risk assessment below maximum.","D&I evaluation does not provide evidence of operation over the period.","Prior-year evidence requires continuing-relevance procedures and rotation limits."],ref:"AU-C 315.34 (SAS 145); AU-C 330.08"},
{a:2,q:"The auditor identified a significant risk related to revenue from bill-and-hold arrangements but does not plan to rely on controls. Which statement is correct?",
o:["The auditor need not understand any controls related to the significant risk.","The auditor must still identify controls that address the significant risk and evaluate their design and determine whether they have been implemented.","The auditor must test the operating effectiveness of the controls.","The auditor may assess the significant risk as low."],
c:1,r:["D&I evaluation of controls over significant risks is required.","Correct. SAS 145 requires identifying controls that address significant risks and evaluating their D&I, regardless of planned reliance.","Operating effectiveness tests are required only if relying.","Significant risks are by definition at the upper end of the inherent risk spectrum."],ref:"AU-C 315.26 (SAS 145)"},
{a:2,q:"Which of the following best illustrates incorporating an element of <b>unpredictability</b> in response to fraud risk?",
o:["Performing the same procedures at the same time each year.","Testing account balances and assertions not otherwise tested due to their materiality or risk, and varying sampling methods and the timing and location of procedures.","Informing management in advance of which locations will be visited.","Relying exclusively on analytical procedures."],
c:1,r:["Repetition reduces unpredictability.","Correct. AU-C 240.A37 gives these examples.","Advance notice reduces unpredictability.","Exclusive reliance on analytics is not an unpredictability response."],ref:"AU-C 240.A37"},
{a:2,q:"The auditor determined planning materiality at $500,000 based on forecasted pretax income. Actual pretax income turned out to be $3.2 million rather than the $10 million forecast. The auditor reduces materiality to $160,000. Which additional step is most important?",
o:["None; materiality changes do not affect procedures performed.","Determine whether performance materiality and the nature, timing, and extent of further audit procedures remain appropriate, including whether procedures already performed were sufficient at the lower threshold.","Increase the clearly trivial threshold.","Document only the new materiality amount."],
c:1,r:["Procedures may need to be revised.","Correct. AU-C 320.13 requires reconsidering performance materiality and further procedures when materiality is revised downward.","The clearly trivial threshold would decrease.","Documentation alone does not address the effects."],ref:"AU-C 320.12–.13"},
{a:2,q:"A SOC 1 Type 2 report on a service organization's controls includes a qualified opinion because a control over user access changes did not operate effectively during the period. The user auditor planned to rely on this control. The user auditor should:",
o:["Rely on the report because the opinion is not adverse.","Consider the effect of the exception on the assessment of control risk and on planned procedures, such as testing complementary user entity controls or compensating controls, or increasing substantive procedures.","Disregard the report entirely.","Refer to the qualified SOC report in the auditor's report."],
c:1,r:["A qualification affects planned reliance.","Correct. AU-C 402.17–.18 requires evaluating exceptions and modified opinions and their effect on the audit.","The report still provides useful evidence for other controls.","The user auditor does not refer to the service auditor's report."],ref:"AU-C 402.17–.18"},
{a:2,q:"In an integrated audit, the auditor tests an entity-level control consisting of the CFO's monthly review of operating results. Which factor most directly affects whether the review is precise enough to address the risk of misstatement in revenue?",
o:["Whether the CFO is a CPA.","The threshold for investigating differences, the level of disaggregation of data reviewed, and the consistency and predictability of expectations used in the review.","Whether the review is documented in board minutes.","The number of years the CFO has been employed."],
c:1,r:["Credentials affect competence but not precision directly.","Correct. AS 2201.24 and related guidance discuss precision factors such as disaggregation, consistency, predictability, and investigation thresholds.","Minutes do not establish precision.","Tenure does not determine precision."],ref:"PCAOB AS 2201.24"},
{a:2,q:"In an integrated audit, which statement about using knowledge from prior years' audits is correct?",
o:["The auditor may rely on controls tested in prior years without current-year testing, using a three-year rotation.","Knowledge from prior years may reduce the nature, timing, or extent of testing, but the auditor must obtain sufficient evidence about operating effectiveness as of the current-year date for the ICFR opinion.","Prior-year evidence is irrelevant.","The auditor may opine on ICFR based on management's testing alone."],
c:1,r:["The three-year rotation applies to financial statement audits (AU-C 330), not to the ICFR opinion.","Correct. AS 2201.57–.61 allows using prior knowledge to adjust testing, but each year's opinion requires current-year evidence.","Prior knowledge is relevant.","Management's testing does not replace the auditor's."],ref:"PCAOB AS 2201.57–.61"},
{a:2,q:"An auditor considers applying Benford's Law analysis as a risk assessment ADA. For which population is it LEAST likely to be effective?",
o:["Vendor invoice amounts across several thousand transactions.","Sequentially assigned check numbers.","Customer payment amounts over a year.","Expense reimbursement amounts across many employees."],
c:1,r:["Naturally occurring amounts across many transactions are generally suitable.","Correct. Assigned numbers, such as check numbers, do not follow Benford's distribution. Populations with thresholds, caps, or assigned values are poor candidates.","Payment amounts are often suitable.","Reimbursements can be suitable, though policy limits may distort the results."],ref:"AICPA ADA Guide"},
{a:2,q:"An auditor designs a dual-purpose test on vendor invoices: a test of the approval control (tolerable rate 5%, required sample 59) and a substantive test of amounts (required sample 40). The sample size for the dual-purpose test should be:",
o:["40","59","99","Any size between 40 and 59"],
c:1,r:["40 would be insufficient for the control test.","Correct. A dual-purpose sample should be the larger of the samples required for the two purposes.","The two samples are not added together.","The larger sample is required."],ref:"AICPA Audit Sampling Guide"},
{a:2,q:"A company's management uses a spreadsheet model to compute a material inventory reserve. In understanding the information system, the auditor learns that the spreadsheet has no access or version controls. This most likely affects the auditor's:",
o:["Assessment of risks arising from IT and the reliability of information used in the estimate.","Determination of overall materiality only.","Assessment of the entity's going concern.","Independence."],
c:0,r:["Correct. End-user computing tools without controls create risks related to data integrity and formula changes, which affect RMM and the evaluation of IPE.","Materiality is not directly affected.","Going concern is not implicated.","Independence is not affected."],ref:"AU-C 315 (SAS 145); AU-C 540"},
{a:2,q:"In planning, the auditor learns that the sales director's compensation is based solely on gross shipments, and that the company recently began offering a 120-day unconditional return right to distributors. Considering the inherent risk factors, the auditor should most likely:",
o:["Assess inherent risk for revenue occurrence and cutoff (and the returns estimate) toward the higher end of the spectrum, considering susceptibility to misstatement due to fraud and uncertainty in the variable consideration estimate.","Assess inherent risk as low because returns reduce revenue.","Ignore the compensation plan because it applies to a single individual.","Focus solely on the completeness of revenue."],
c:0,r:["Correct. Incentives (fraud susceptibility) combined with estimation uncertainty around returns elevate risk for occurrence, cutoff, and valuation of variable consideration.","Return rights increase estimation risk.","A single key individual's incentive can create significant risk.","The incentive points toward overstatement, not completeness."],ref:"AU-C 315 (SAS 145); AU-C 240"},
{a:2,q:"Using process-mining analytics on the order-to-cash event log, the auditor finds that 6% of shipped orders followed a path that skipped the automated credit-check step, all initiated by two users with elevated privileges. During risk assessment, this finding most directly indicates:",
o:["The automated credit-check control is operating effectively because 94% of orders passed through it.","A possible deficiency in ITGCs (access) and in the credit-check control, raising the assessed risk for the valuation of receivables and possibly for the occurrence of revenue.","No effect, because process mining is not an accepted audit procedure.","A need to disclaim an opinion."],
c:1,r:["A 6% bypass rate by privileged users undermines reliance on the control.","Correct. Bypassed control steps by privileged users suggest both access (ITGC) and application control issues, increasing risk for receivable valuation and potentially revenue occurrence.","Process mining is a valid ADA technique.","A disclaimer is not indicated at the risk assessment stage."],ref:"AICPA ADA Guide; AU-C 315 (SAS 145)"}
