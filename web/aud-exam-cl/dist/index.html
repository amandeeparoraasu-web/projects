// ---------- AREA III (26) ----------
{a:3,q:"In testing the operating effectiveness of a control, the auditor's upper deviation rate exceeds the tolerable rate of deviation. Which response is most appropriate?",
o:["Conclude the control is effective because the sample deviation rate is below the tolerable rate.","Revise the assessed level of control risk upward and modify the nature, timing, and extent of substantive procedures for the related assertions.","Reduce the tolerable rate and re-evaluate the sample.","Disregard the deviations if no monetary misstatements resulted."],
c:1,r:["The comparison must use the upper deviation rate (sample rate plus allowance for sampling risk), not the sample rate alone.","Correct. When the upper deviation rate exceeds the tolerable rate, the sample does not support the planned reliance. The auditor increases assessed control risk and expands substantive work (or tests compensating controls).","Lowering the tolerable rate makes the comparison worse and is not a valid response.","Control deviations matter even without a monetary misstatement in the sampled items."],ref:"AU-C 530; AICPA Audit Sampling Guide"},
{a:3,q:"In planning a monetary unit sample, the auditor increases the expected misstatement while holding tolerable misstatement and risk of incorrect acceptance constant. The effect is:",
o:["A larger sampling interval and smaller sample size.","A smaller sampling interval and larger sample size.","No effect on sample size.","A larger sampling interval and larger sample size."],
c:1,r:["Higher expected misstatement reduces the interval.","Correct. Interval = (tolerable misstatement − expected misstatement × expansion factor) ÷ reliability factor. A higher expected misstatement shrinks the interval and increases the sample.","Expected misstatement directly affects the interval.","Interval and sample size move in opposite directions."],ref:"AICPA Audit Sampling Guide (MUS)"},
{a:3,q:"Which is an advantage of monetary unit sampling compared with classical variables sampling?",
o:["It is designed primarily to detect understatements.","It does not require an estimate of the population's standard deviation, and it automatically gives larger items a higher chance of selection (items equal to or greater than the interval are always selected).","It works best when many misstatements are expected.","It handles zero and negative balances without special consideration."],
c:1,r:["MUS is weak at detecting understatements.","Correct. MUS automatically stratifies by dollar value and needs no variability estimate.","Many expected misstatements make MUS inefficient. Classical methods may be better.","Zero and negative balances require special handling in MUS."],ref:"AICPA Audit Sampling Guide"},
{a:3,q:"Which is a disadvantage of monetary unit sampling?",
o:["It requires a large sample when the population is highly variable.","When misstatements are found, the allowance for sampling risk may be overstated, causing the auditor to reject an acceptable recorded amount.","It cannot be applied to accounts receivable.","It requires the auditor to estimate the population's standard deviation."],
c:1,r:["High variability is a problem for classical variables sampling, not MUS.","Correct. The conservative MUS evaluation can produce a high upper misstatement limit when misstatements are found, which can lead to incorrect rejection (an efficiency issue).","MUS is commonly applied to receivables.","MUS does not require a standard deviation estimate."],ref:"AICPA Audit Sampling Guide"},
{a:3,q:"For a population in which individual recorded amounts are not available, which sampling approach would be most appropriate for estimating the total value?",
o:["Difference estimation","Ratio estimation","Mean-per-unit estimation","Monetary unit sampling"],
c:2,r:["Difference estimation requires individual recorded amounts to compute differences.","Ratio estimation also requires recorded amounts.","Correct. Mean-per-unit projects the average audited value to the population and does not need individual book values.","MUS selects dollars from recorded amounts, so it requires book values."],ref:"AICPA Audit Sampling Guide"},
{a:3,q:"An auditor uses nonstatistical sampling for a substantive test of details and finds misstatements in the sample. Under AU-C 530, the auditor should:",
o:["Evaluate only the actual misstatements found, because projection is required only in statistical sampling.","Project the misstatements found in the sample to the population and consider the effect of sampling risk.","Increase the sample size until no misstatements are found.","Treat all misstatements as anomalies."],
c:1,r:["Projection is required for both statistical and nonstatistical sampling.","Correct. AU-C 530.14 requires projecting misstatements to the population regardless of sampling approach.","Expanding the sample is not the required evaluation.","Anomalies require a high degree of certainty, supported by procedures."],ref:"AU-C 530.14"},
{a:3,q:"In a monetary unit sample with a sampling interval of $25,000, the auditor finds that an account with a recorded amount of $40,000 is overstated by $6,000. How is this misstatement treated in evaluating the sample?",
o:["It is projected using a 15% tainting factor multiplied by the interval, giving $3,750.","It is included at its actual amount of $6,000, with no projection and no incremental allowance for sampling risk.","It is excluded because the item was selected with certainty.","It is projected as $6,000 × ($40,000 ÷ $25,000)."],
c:1,r:["Tainting projection applies to items smaller than the interval.","Correct. Items equal to or greater than the interval are effectively tested 100%, so their actual misstatement is used without projection or added sampling-risk allowance.","Misstatements in certainty items must be included.","This is not a recognized MUS calculation."],ref:"AICPA Audit Sampling Guide (MUS)"},
{a:3,q:"An auditor uses ADA to perform a three-way match of 100% of purchase transactions (purchase order, receiving report, and vendor invoice). Which assertion is this procedure LEAST likely to address?",
o:["Occurrence of recorded purchases.","Accuracy of recorded purchase amounts.","Completeness of accounts payable at year-end.","Authorization of recorded purchases."],
c:2,r:["Matching recorded invoices to receipts supports occurrence.","Matching quantities and prices supports accuracy.","Correct. A three-way match of recorded transactions cannot identify liabilities that were never recorded. Completeness requires procedures such as a search for unrecorded liabilities.","Matching to approved purchase orders supports authorization."],ref:"AICPA ADA Guide; AU-C 500"},
{a:3,q:"An ADA identifies 214 “notable items” (outliers) among 50,000 revenue transactions. Which statement is correct?",
o:["All 214 items are misstatements and must be proposed as adjustments.","The auditor should evaluate the notable items to determine whether they indicate misstatement or a control deficiency; the evaluation may involve grouping items with common characteristics and performing additional procedures.","Notable items may be ignored if they are less than 1% of the population.","The ADA is invalid because it produced exceptions."],
c:1,r:["Outliers are not automatically misstatements.","Correct. The ADA Guide explains that notable items require evaluation. The auditor may refine the analysis, group items, and perform procedures on them.","Proportion alone does not justify ignoring them.","Exceptions are the expected product of a well-designed ADA."],ref:"AICPA Guide to Audit Data Analytics"},
{a:3,q:"To test the completeness of revenue using ADA, the auditor would most likely:",
o:["Match the full population of shipping records to invoices and the sales journal and investigate unmatched shipments.","Stratify recorded invoices by dollar amount.","Vouch recorded invoices to customer orders.","Recompute sales tax on all invoices."],
c:0,r:["Correct. Starting from shipments (the population that should be billed) and identifying unmatched items tests completeness.","Stratification of recorded items does not test completeness.","Vouching recorded items tests occurrence.","Recomputing tax tests accuracy of tax."],ref:"AICPA ADA Guide"},
{a:3,q:"An auditor plans to use a regression-based ADA as a substantive analytical procedure for monthly revenue by store. Under AU-C 520, which consideration is most critical to whether the procedure provides sufficient evidence?",
o:["Whether the software used is commercially licensed.","Whether the expectation is sufficiently precise to identify a misstatement that, individually or in aggregate, may cause the financial statements to be materially misstated.","Whether management has reviewed the regression output.","Whether the regression uses more than ten variables."],
c:1,r:["Software licensing does not determine evidential value.","Correct. AU-C 520.05 requires evaluating whether the expectation is sufficiently precise, along with the reliability of data and the amount of acceptable difference.","Management's review does not establish precision.","More variables do not ensure precision."],ref:"AU-C 520.05"},
{a:3,q:"Compared with a positive confirmation that states the balance, a positive confirmation that leaves the amount blank and asks the recipient to fill it in:",
o:["Provides less reliable evidence but a higher response rate.","Provides more reliable evidence but may result in lower response rates and more follow-up work.","Is a negative confirmation.","Is prohibited under AU-C 505."],
c:1,r:["The reliability comparison is reversed.","Correct. Blank forms reduce the risk that recipients simply agree without checking, but may lower response rates.","Negative confirmations request a response only if the recipient disagrees.","Blank forms are permitted."],ref:"AU-C 505.A6"},
{a:3,q:"During the inventory observation, the auditor's test counts differ significantly from the client's counts in one warehouse section. The auditor should most appropriately:",
o:["Correct the client's count sheets.","Ask the client to recount the section and consider expanding test counts, evaluating whether the differences indicate broader count problems.","Ignore the differences if the total inventory is immaterial.","Disclaim an opinion."],
c:1,r:["The auditor does not correct the client's records.","Correct. Significant differences require investigation, a recount, and possibly expanded procedures.","Total immateriality has not been established.","A disclaimer is premature."],ref:"AU-C 501"},
{a:3,q:"An auditor uses an ADA that compares shipment dates with invoice dates and revenue recognition dates for all transactions within five business days before and after year-end. This procedure most directly tests:",
o:["Valuation of receivables","Cutoff of revenue","Classification of revenue","Rights and obligations"],
c:1,r:["Valuation concerns collectibility.","Correct. Comparing shipment (transfer of control) dates to recognition dates around year-end tests cutoff.","Classification concerns accounts used.","Rights and obligations relate to ownership of assets."],ref:"AICPA ADA Guide; AU-C 500"},
{a:3,q:"Under AU-C 540 (SAS 143), the auditor develops a range for an accounting estimate of $700,000 to $780,000, supported by sufficient appropriate evidence. Management's point estimate is $650,000. The misstatement is:",
o:["$0, because estimates are inherently imprecise.","$50,000 understatement (difference to the nearest point of the auditor's range).","$90,000 understatement (difference to the midpoint).","$130,000 understatement (difference to the far end of the range)."],
c:1,r:["Management's estimate is outside a supported range, so a misstatement exists.","Correct. When management's estimate falls outside the auditor's range, the misstatement is at least the difference between management's estimate and the nearest point of the range ($700,000 − $650,000).","The midpoint is not the measure.","The far end overstates the misstatement."],ref:"AU-C 540 (SAS 143)"},
{a:3,q:"For a Level 3 fair value measurement, the auditor chooses to test how management made the estimate. Which procedures are most consistent with this approach?",
o:["Comparing to a quoted price in an active market.","Evaluating whether the method is appropriate, whether significant assumptions are reasonable, and whether the data used are relevant and reliable.","Developing an independent model only.","Obtaining a representation from management only."],
c:1,r:["Level 3 instruments do not have quoted prices for identical items in active markets.","Correct. AU-C 540 identifies method, significant assumptions, and data as the elements to test under this approach.","Developing an independent estimate is a different approach.","Representations alone are insufficient."],ref:"AU-C 540.22–.27"},
{a:3,q:"In a GAAS audit, for a manual control that operates multiple times daily, the auditor performed inquiry and a walkthrough of one transaction. Which conclusion is appropriate?",
o:["The procedures provide sufficient evidence of operating effectiveness throughout the period.","The procedures may help evaluate design and implementation, but are not sufficient evidence of operating effectiveness throughout the period; a larger sample is needed if the auditor intends to rely on the control.","Walkthroughs are prohibited in nonissuer audits.","Inquiry alone would have been sufficient."],
c:1,r:["A single walkthrough does not test operation over the period for a recurring manual control.","Correct. D&I evaluation and operating effectiveness are distinct. Reliance requires sampled tests across the period.","Walkthroughs are permitted.","Inquiry alone is insufficient (AU-C 330.10)."],ref:"AU-C 315; AU-C 330.10"},
{a:3,q:"The auditor wants to use a system-generated aged receivables report. ITGCs over the application were tested and found effective. Which approach is most appropriate for evaluating the report's reliability?",
o:["No procedures are needed because ITGCs are effective.","Test the report's logic (for example, by testing the aging calculation and its completeness against the ledger) and test that appropriate parameters were used when the report was generated.","Obtain a management representation only.","Re-create the entire report manually every year."],
c:1,r:["Effective ITGCs support but do not replace testing the report's accuracy and completeness.","Correct. Testing report logic and parameters, supported by effective ITGCs, provides evidence of reliability (AU-C 500.09).","Representations alone are insufficient.","Full manual re-creation is not necessary."],ref:"AU-C 500.09"},
{a:3,q:"Under AU-C 500 as amended by SAS No. 142, when the auditor uses information from an external information source (for example, an industry pricing service), the auditor should:",
o:["Consider the information reliable without further procedures because it is external.","Consider the relevance and reliability of the information, including attributes such as the source's reputation, the method used, and whether the information is consistent with other evidence.","Obtain a confirmation from the source for each data point.","Avoid using external information sources."],
c:1,r:["External sources are not automatically reliable.","Correct. SAS 142 requires evaluating the relevance and reliability of information intended for use as audit evidence, including information from external sources.","Confirmations are not required for each data point.","External sources may be used."],ref:"AU-C 500 (SAS 142)"},
{a:3,q:"Under AU-C 500 as amended by SAS No. 142, which statement about audit evidence is correct?",
o:["Only evidence that corroborates management's assertions is considered.","The auditor should consider all relevant audit evidence, regardless of whether it corroborates or contradicts the assertions, and evaluate the effect of inconsistent evidence.","Evidence that contradicts assertions should be documented only if material.","Evidence obtained from data analytics is excluded from evaluation."],
c:1,r:["Contradictory evidence must be considered.","Correct. SAS 142 emphasizes considering evidence regardless of whether it corroborates or contradicts management's assertions.","Contradictory evidence must be evaluated, not merely documented.","ADA results are audit evidence."],ref:"AU-C 500 (SAS 142)"},
{a:3,q:"Late in the audit, the auditor identifies a related party relationship that management did not previously disclose. Under AU-C 550, the auditor should do all of the following EXCEPT:",
o:["Promptly communicate the information to the other members of the engagement team.","Request management to identify all transactions with the newly identified related party for further evaluation.","Inquire why the entity's controls failed to identify or disclose the relationship.","Conclude that no further procedures are needed if the transactions appear immaterial."],
c:3,r:["Communication to the engagement team is required.","A request for management to identify all transactions is required.","Inquiry about the control failure is required.","Correct. AU-C 550.22 requires the auditor to perform appropriate substantive procedures and reconsider the risk of other undisclosed related parties. Apparent immateriality does not end the inquiry, especially as nondisclosure may indicate fraud."],ref:"AU-C 550.22"},
{a:3,q:"In a lawyer's response to a letter of inquiry, counsel states that the response is limited to matters to which the lawyer has given substantive attention in the form of legal consultation or representation. This limitation is:",
o:["A scope limitation that requires a qualified opinion.","Not a limitation on the scope of the audit.","A reason to disclaim an opinion.","A reason to send a letter to opposing counsel."],
c:1,r:["This is a customary limitation, not a scope limitation.","Correct. AU-C 501 guidance notes that limitations on the response due to the lawyer's substantive attention, or materiality thresholds agreed with management, are not scope limitations.","No disclaimer is warranted.","Opposing counsel is not contacted."],ref:"AU-C 501"},
{a:3,q:"The lawyer's response letter is dated January 25. The auditor's report will be dated March 18. The auditor should:",
o:["Rely on the January 25 response because it was received before the report date.","Obtain an update from the lawyer, which may be oral if documented, about any changes through a date close to the report date.","Redate the report to January 25.","Ignore the gap because no lawsuits are expected."],
c:1,r:["The response should cover a period close to the report date.","Correct. AU-C 501 guidance indicates the lawyer's response should be as close as practicable to the report date. Updates may be obtained and documented.","The report date reflects completion of evidence.","Expectations do not replace evidence."],ref:"AU-C 501"},
{a:3,q:"Under AU-C 230, documentation of an ADA performed as a substantive procedure should most appropriately include:",
o:["Only the conclusion reached.","The data used and its source, the procedures to evaluate data reliability, the objective and design of the ADA (including criteria and thresholds), the results, and how notable items were followed up.","The software license number.","The client's permission to use the data."],
c:1,r:["Conclusions alone do not meet the experienced-auditor standard.","Correct. Documentation should allow an experienced auditor to understand the nature, timing, extent, results, and conclusions, including data reliability and follow-up.","License numbers are not required.","Client permission is not a documentation requirement."],ref:"AU-C 230.08; AICPA ADA Guide"},
{a:3,q:"A client estimates its inventory quantities using a statistical sampling method instead of an annual full physical count. The auditor should:",
o:["Insist on a full physical count.","Be satisfied that the sampling plan is reasonable and statistically valid, that it has been properly applied, and that the results are reasonable, while observing the counts of sampled items.","Rely entirely on the client's method without observation.","Issue a qualified opinion."],
c:1,r:["Sampling methods to estimate inventory are acceptable if reliable.","Correct. AU-C 501 guidance discusses evaluating statistical sampling methods used by the entity and observing the counts.","Observation is still needed.","No qualification is needed if evidence is sufficient."],ref:"AU-C 501"},
{a:3,q:"An auditor uses ADA to match bank account numbers in the vendor master file against bank account numbers in the employee payroll master file. A match most likely indicates:",
o:["Duplicate vendor invoices","A possible fictitious vendor or employee conflict of interest that warrants investigation","Unrecorded liabilities","Payroll cutoff errors"],
c:1,r:["Duplicate invoices are detected by matching invoice data.","Correct. An employee's bank account appearing in the vendor file is a classic fraud indicator, such as a shell vendor.","Unrecorded liabilities are not indicated.","Cutoff is not indicated."],ref:"AICPA ADA Guide; AU-C 240"},
// ---------- AREA IV (14) ----------
{a:4,q:"Substantial doubt about Calder Co.'s ability to continue as a going concern remains after considering management's plans, but the notes to the financial statements do not adequately disclose the conditions. The auditor should express:",
o:["An unmodified opinion with a going-concern section.","A qualified or adverse opinion, as appropriate, describing the inadequate disclosure in the basis section.","A disclaimer of opinion.","An unmodified opinion with an other-matter paragraph."],
c:1,r:["The separate section applies when disclosure is adequate.","Correct. Inadequate disclosure is a misstatement. AU-C 570 requires a qualified or adverse opinion.","A disclaimer is not the prescribed response.","Other-matter paragraphs do not cure misstatements."],ref:"AU-C 570"},
{a:4,q:"In which situation might an auditor disclaim an opinion even though sufficient appropriate evidence was obtained for each individual uncertainty?",
o:["When there is a single significant uncertainty that is adequately disclosed.","In extremely rare situations involving multiple uncertainties, when it is not possible to form an opinion because of the potential interaction and cumulative effect of the uncertainties.","Whenever going-concern doubt exists.","When management prefers a disclaimer."],
c:1,r:["A single adequately disclosed uncertainty does not warrant a disclaimer.","Correct. AU-C 705 (and AU-C 570) allow a disclaimer in extremely rare situations with multiple uncertainties.","Going-concern doubt usually results in a separate section, not a disclaimer.","Management preferences are irrelevant."],ref:"AU-C 705; AU-C 570"},
{a:4,q:"After accepting the engagement, the auditor becomes aware that management has imposed a limitation on scope that will likely result in a qualified opinion or disclaimer. The auditor should first:",
o:["Issue a disclaimer immediately.","Request that management remove the limitation; if management refuses, communicate the matter to those charged with governance and determine whether alternative procedures can provide sufficient evidence.","Withdraw without communication.","Proceed and issue an unmodified opinion."],
c:1,r:["The auditor first seeks removal and alternatives.","Correct. AU-C 705 describes this sequence. If possible effects are material and pervasive, the auditor withdraws when practicable or disclaims.","Communication to TCWG is required.","An unmodified opinion is inappropriate without evidence."],ref:"AU-C 705"},
{a:4,q:"An auditor engaged to communicate KAMs in a nonissuer audit also concludes that substantial doubt about going concern exists (adequately disclosed). How should the going-concern matter be reported?",
o:["As a KAM in the KAM section only.","In the separate going-concern section, not described as a KAM in the KAM section, although the KAM section may refer to the going-concern section.","In an other-matter paragraph.","It should not be reported because KAMs replace going-concern reporting."],
c:1,r:["Going-concern matters are not described as KAMs.","Correct. AU-C 701 states that matters giving rise to a modified opinion or substantial doubt about going concern are by nature KAMs but are reported in their own sections, with a reference in the KAM section.","Other-matter paragraphs are not used.","KAMs do not replace going-concern reporting."],ref:"AU-C 701"},
{a:4,q:"After the report date, the auditor reads other information in the annual report and concludes it contains an uncorrected material misstatement, which management refuses to correct. Under AU-C 720, the auditor should:",
o:["Withdraw the auditor's report and reissue it with a qualified opinion.","Take appropriate action considering the auditor's legal rights and obligations, such as communicating with those charged with governance and seeking legal advice.","Ignore it because the report was already issued.","Issue an adverse opinion."],
c:1,r:["The financial statements are not misstated, so a qualification is not appropriate.","Correct. AU-C 720 addresses uncorrected misstatements of other information obtained after the report date.","The auditor has responsibilities for other information obtained after the report date.","An adverse opinion is not appropriate."],ref:"AU-C 720"},
{a:4,q:"Which statement correctly distinguishes required supplementary information (RSI) from supplementary information (SI) accompanying audited financial statements?",
o:["Both receive an “in relation to” opinion.","RSI is required by a designated accounting standard setter, and the auditor applies limited procedures and expresses no opinion; SI is not required by the framework, and the auditor may report on whether it is fairly stated in relation to the financial statements as a whole.","Neither is addressed in the auditor's report.","RSI receives a full opinion; SI receives none."],
c:1,r:["Only SI may receive an “in relation to” opinion.","Correct. AU-C 730 (RSI) and AU-C 725 (SI) set these different requirements.","Both are addressed in the report.","RSI receives no opinion."],ref:"AU-C 725; AU-C 730"},
{a:4,q:"Under PCAOB AS 3101, communication of critical audit matters is NOT required in audits of:",
o:["Large accelerated filers.","Emerging growth companies, brokers and dealers, investment companies other than business development companies, and certain employee benefit plans.","All accelerated filers.","Companies with going-concern issues."],
c:1,r:["CAMs are required for large accelerated filers.","Correct. AS 3101.05 lists these exemptions.","CAMs are required for accelerated filers.","Going-concern issues do not exempt CAMs."],ref:"PCAOB AS 3101.05"},
{a:4,q:"In an integrated audit, management restricts the auditor from testing controls at a significant location. The auditor cannot obtain sufficient evidence about ICFR. Under AS 2201, the auditor should:",
o:["Express a qualified opinion on ICFR.","Withdraw from the engagement or disclaim an opinion on ICFR.","Express an adverse opinion on the financial statements.","Ignore the location."],
c:1,r:["AS 2201 does not permit a qualified opinion on ICFR for a scope limitation.","Correct. AS 2201 Appendix C states the auditor should withdraw or disclaim when a scope limitation exists.","The financial statement opinion is evaluated separately.","The restriction cannot be ignored."],ref:"PCAOB AS 2201 App. C"},
{a:4,q:"An issuer acquired a business late in the year and, as permitted by the SEC, excluded it from management's assessment of ICFR. In the auditor's report on ICFR, the auditor:",
o:["Must disclaim an opinion.","May similarly limit the audit and should include a paragraph disclosing the exclusion and the significance of the excluded entity.","Must include the acquired business in testing.","Must express an adverse opinion."],
c:1,r:["No disclaimer is required.","Correct. AS 2201 guidance permits the auditor to limit the audit similarly and requires disclosure of the exclusion.","Testing the excluded business is not required.","No adverse opinion is warranted solely for the exclusion."],ref:"PCAOB AS 2201 App. B"},
{a:4,q:"In a review engagement under SSARS, the accountant concludes that a departure from GAAP is material and pervasive, and management refuses to revise the financial statements. Under AR-C 90 (as amended by SSARS No. 25), the accountant should:",
o:["Issue a disclaimer.","Express an adverse conclusion, describing the departure in the basis section.","Express an unmodified conclusion.","Issue a compilation report instead."],
c:1,r:["Disclaimers are not issued in reviews.","Correct. SSARS No. 25 provides for an adverse conclusion when the effects are both material and pervasive.","An unmodified conclusion is inappropriate.","Changing the engagement to avoid modification is not appropriate."],ref:"AR-C 90 (SSARS 25)"},
{a:4,q:"In the prior year, the auditor communicated a material weakness in writing to management and those charged with governance. It has not been remediated. In the current year, the auditor:",
o:["Need not communicate it again.","Should communicate it again in writing, though the communication may refer to the previous written communication.","Should communicate it orally only.","Should include it in the auditor's report as an other-matter paragraph."],
c:1,r:["Unremediated SDs and MWs must be communicated each year.","Correct. AU-C 265 requires written communication in the current audit, which may reference the prior communication.","Written communication is required.","It is not included in the report on the financial statements."],ref:"AU-C 265"},
{a:4,q:"A utility prepares financial statements using a regulatory basis of accounting, and the statements are intended for general use. Under AU-C 800, the auditor's report should:",
o:["Express only an opinion on the regulatory basis, with a restricted-use alert.","Express an opinion on whether the statements are presented in accordance with GAAP (adverse if the differences are material and pervasive) and a separate opinion on whether they are presented in accordance with the regulatory basis.","Express a disclaimer.","Express an unmodified GAAP opinion."],
c:1,r:["Use restriction applies when the statements are not intended for general use.","Correct. When regulatory-basis statements are intended for general use, AU-C 800 requires a GAAP opinion and a separate regulatory-basis opinion.","A disclaimer is not appropriate.","An unmodified GAAP opinion would be incorrect if material differences exist."],ref:"AU-C 800"},
{a:4,q:"The auditor's report was dated March 5. Before the report was released, management disclosed in Note 18 a material subsequent event that occurred on March 12. The auditor performed procedures only on that event. The report should be dated:",
o:["March 5.","March 5, except for Note 18, as to which the date is March 12 (or later date on which procedures on the event were completed).","March 12, with responsibility only for Note 18.","The release date."],
c:1,r:["The original date does not reflect procedures on the new disclosure.","Correct. Dual dating limits responsibility to the specific subsequent event (AU-C 560).","Redating to a single later date extends responsibility to all subsequent events through that date.","The release date is not used."],ref:"AU-C 560"},
{a:4,q:"Comparative financial statements are presented. The prior-year statements, previously audited by the same auditor, were restated to correct a material misstatement. The current auditor's report should:",
o:["Not mention the restatement.","Include an emphasis-of-matter paragraph regarding the correction of the misstatement, and the updated opinion on the prior year should address the restated statements.","Qualify the opinion on the current year.","Disclaim on the prior year."],
c:1,r:["The correction must be highlighted.","Correct. AU-C 708 requires an EOM paragraph for corrections of material misstatements in previously issued statements.","The current year is not misstated.","No disclaimer is required."],ref:"AU-C 708"}
]});

{a:3,title:"Attribute Sampling: Planning and Evaluation",
instr:"<p>You are testing two controls at <b>Marlowe Industrial Supply</b> for the year ended December 31, 20X6, with a <b>5% risk of overreliance</b>. Use the exhibits to determine sample sizes and evaluate results. Enter percentages to <b>one decimal</b> (for example, 3.4) and sample sizes as whole numbers.</p>",
exhibits:[
{title:"Test Plan & Results",html:"<table><tr><th></th><th>Control A: credit approval before shipment</th><th>Control B: three-way match before payment</th></tr><tr><td>Population</td><td>21,400 sales orders</td><td>9,850 disbursements</td></tr><tr><td>Tolerable deviation rate</td><td class='num'>7%</td><td class='num'>6%</td></tr><tr><td>Expected population deviation rate</td><td class='num'>1.5%</td><td class='num'>1.5%</td></tr><tr><td>Deviations found</td><td class='num'>3</td><td class='num'>1</td></tr></table><p>Control B's single deviation: the AP manager overrode the system block and released a payment without a receiving report, and the related goods were never received.</p>"},
{title:"Table 1: Sample Size",html:"<p>Statistical sample sizes for tests of controls, <b>5% risk of overreliance</b> (large populations)</p><table><tr><th>Expected deviation rate</th><th class='num'>TR 5%</th><th class='num'>TR 6%</th><th class='num'>TR 7%</th><th class='num'>TR 8%</th></tr><tr><td>0.00%</td><td class='num'>59</td><td class='num'>49</td><td class='num'>42</td><td class='num'>36</td></tr><tr><td>0.50%</td><td class='num'>93</td><td class='num'>78</td><td class='num'>66</td><td class='num'>58</td></tr><tr><td>1.00%</td><td class='num'>93</td><td class='num'>78</td><td class='num'>66</td><td class='num'>58</td></tr><tr><td>1.50%</td><td class='num'>124</td><td class='num'>103</td><td class='num'>88</td><td class='num'>77</td></tr><tr><td>2.00%</td><td class='num'>181</td><td class='num'>127</td><td class='num'>88</td><td class='num'>77</td></tr></table>"},
{title:"Table 2: Evaluation",html:"<p>Upper deviation rate (%) at <b>5% risk of overreliance</b></p><table><tr><th>Sample size</th><th class='num'>0 dev</th><th class='num'>1 dev</th><th class='num'>2 dev</th><th class='num'>3 dev</th></tr><tr><td>78</td><td class='num'>3.8</td><td class='num'>5.9</td><td class='num'>7.9</td><td class='num'>9.6</td></tr><tr><td>88</td><td class='num'>3.3</td><td class='num'>5.3</td><td class='num'>7.0</td><td class='num'>8.6</td></tr><tr><td>103</td><td class='num'>2.9</td><td class='num'>4.5</td><td class='num'>6.0</td><td class='num'>7.4</td></tr><tr><td>127</td><td class='num'>2.3</td><td class='num'>3.7</td><td class='num'>4.9</td><td class='num'>6.0</td></tr></table>"}],
rows:[
{p:"Required sample size: Control A",type:"num",a:88,tol:0,fmt:"88",e:"Table 1: expected rate 1.50%, tolerable rate 7% = 88."},
{p:"Required sample size: Control B",type:"num",a:103,tol:0,fmt:"103",e:"Table 1: expected rate 1.50%, tolerable rate 6% = 103."},
{p:"Control A: sample deviation rate (%)",type:"num",a:3.4,tol:0.05,fmt:"3.4",e:"3 ÷ 88 = 3.4%. Note that this exceeds the 1.5% expected rate, a warning sign before you even consult Table 2."},
{p:"Control A: upper deviation rate (%)",type:"num",a:8.6,tol:0.05,fmt:"8.6",e:"Table 2: sample size 88, 3 deviations = 8.6%."},
{p:"Control A: conclusion",o:["Rely on the control as planned","Do not rely as planned: the upper deviation rate exceeds the tolerable rate; assess control risk higher and expand substantive procedures","Rely, because the sample deviation rate (3.4%) is below the tolerable rate (7%)","Increase the tolerable rate to 9% and rely"],a:1,e:"8.6% > 7%. Comparing the sample rate to the tolerable rate ignores sampling risk, and raising the tolerable rate after the fact is improper."},
{p:"Control B: upper deviation rate (%)",type:"num",a:4.5,tol:0.05,fmt:"4.5",e:"Table 2: sample size 103, 1 deviation = 4.5%."},
{p:"Control B: allowance for sampling risk (%)",type:"num",a:3.5,tol:0.06,fmt:"3.5",e:"Upper deviation rate 4.5% − sample rate (1 ÷ 103 = 1.0%) = 3.5%."},
{p:"Control B: considering BOTH quantitative and qualitative results, the auditor should most likely:",o:["Rely on the control because the upper deviation rate (4.5%) is below the tolerable rate (6%)","Not rely on the control as planned, because the deviation was an intentional management override resulting in a payment for goods not received, which has fraud implications that override the favorable quantitative result","Treat the deviation as an anomaly and exclude it","Propose an adjustment only for the single payment and rely on the control"],a:1,e:"AU-C 530 requires evaluating the nature and cause of deviations. An intentional override producing a loss is a fraud indicator. It affects the reliance decision and the fraud risk assessment (AU-C 240), and must be communicated."},
{p:"If Control A's population had been 42,800 instead of 21,400, the required sample size would:",o:["Approximately double","Increase by about 50%","Be essentially unchanged","Decrease"],a:2,e:"For large populations, population size has little or no effect on attribute sample size."}

{a:3,title:"Monetary Unit Sampling: Design and Evaluation",
instr:"<p>You are testing <b>accounts receivable</b> of <b>Ostrander Medical Devices</b> for overstatement using MUS. Use the exhibits. Round the sampling interval to the nearest dollar and round the sample size <b>up</b> to a whole number. Enter whole dollars for amounts.</p>",
exhibits:[
{title:"Design Parameters",html:"<table><tr><td>Recorded amount of receivables</td><td class='num'>$2,400,000</td></tr><tr><td>Tolerable misstatement</td><td class='num'>$75,000</td></tr><tr><td>Expected misstatement</td><td class='num'>$15,000</td></tr><tr><td>Risk of incorrect acceptance</td><td class='num'>5%</td></tr><tr><td>Reliability factor (0 overstatements, 5%)</td><td class='num'>3.00</td></tr><tr><td>Expansion factor (5%)</td><td class='num'>1.6</td></tr></table><p>Sampling interval = (Tolerable misstatement − Expected misstatement × Expansion factor) ÷ Reliability factor</p>"},
{title:"Selected Accounts",html:"<p>Six customer balances from the population:</p><table><tr><th>Customer</th><th class='num'>Recorded</th></tr><tr><td>A. Bayview Hospital</td><td class='num'>42,000</td></tr><tr><td>B. Cedar Clinic</td><td class='num'>16,900</td></tr><tr><td>C. Delmont Health</td><td class='num'>17,000</td></tr><tr><td>D. Evanston Labs</td><td class='num'>9,800</td></tr><tr><td>E. Fairview Medical Group</td><td class='num'>85,500</td></tr><tr><td>F. Grove Pediatrics</td><td class='num'>3,200</td></tr></table>"},
{title:"Misstatements Found",html:"<table><tr><th>Item</th><th class='num'>Recorded</th><th class='num'>Audited</th></tr><tr><td>X</td><td class='num'>4,250</td><td class='num'>3,400</td></tr><tr><td>Y</td><td class='num'>25,000</td><td class='num'>22,000</td></tr><tr><td>Z</td><td class='num'>8,500</td><td class='num'>0</td></tr><tr><td>W</td><td class='num'>2,000</td><td class='num'>2,600</td></tr></table>"},
{title:"Reliability Factors (5%)",html:"<table><tr><th>Overstatements</th><th class='num'>Factor</th></tr><tr><td>0</td><td class='num'>3.00</td></tr><tr><td>1</td><td class='num'>4.75</td></tr><tr><td>2</td><td class='num'>6.30</td></tr><tr><td>3</td><td class='num'>7.76</td></tr></table><p>Incremental factor for the n-th ranked tainting = (RF<sub>n</sub> − RF<sub>n−1</sub>) − 1.0. Rank taintings of items smaller than the interval from largest to smallest. Items at or above the interval receive no incremental allowance.</p>"}],
rows:[
{p:"Sampling interval",type:"num",a:17000,tol:0,fmt:"17,000",e:"(75,000 − 15,000 × 1.6) ÷ 3.00 = 51,000 ÷ 3 = $17,000."},
{p:"Sample size",type:"num",a:142,tol:0,fmt:"142",e:"2,400,000 ÷ 17,000 = 141.2, rounded up to 142."},
{p:"How many of the six accounts in the Selected Accounts exhibit will be selected with certainty?",type:"num",a:3,tol:0,fmt:"3",e:"Items equal to or greater than the $17,000 interval are certain to be selected: A (42,000), C (17,000, equal to the interval), and E (85,500). B at 16,900 is not certain."},
{p:"Total projected overstatement (items X, Y, Z)",type:"num",a:23400,tol:0,fmt:"23,400",e:"X: 850 ÷ 4,250 = 20% × 17,000 = 3,400. Y (≥ interval): actual 3,000. Z: 100% × 17,000 = 17,000. Total $23,400."},
{p:"Basic precision",type:"num",a:51000,tol:0,fmt:"51,000",e:"3.00 × 17,000."},
{p:"Incremental allowance for sampling risk",type:"num",a:14620,tol:0,fmt:"14,620",e:"Rank Z (17,000) then X (3,400). Z: 0.75 × 17,000 = 12,750. X: 0.55 × 3,400 = 1,870. Total $14,620. Y gets none."},
{p:"Upper misstatement limit (overstatement)",type:"num",a:89020,tol:0,fmt:"89,020",e:"23,400 + 51,000 + 14,620 = $89,020."},
{p:"Item W (understatement of $600) in the overstatement evaluation",o:["Subtract its projection from the overstatement limit","Evaluate it separately; it is not used to reduce the overstatement limit, but the auditor considers whether it indicates other understatements","Ignore it because MUS tests only overstatement","Treat it as an anomaly"],a:1,e:"MUS evaluations of overstatement are not reduced by understatements. Understatements are evaluated separately, and MUS is weak at detecting them."},
{p:"Conclusion",o:["Accept: projected misstatement ($23,400) is below tolerable misstatement","Do not accept: the upper misstatement limit ($89,020) exceeds tolerable misstatement ($75,000); request adjustment, perform additional procedures, or consider the effect on the opinion","Accept, because basic precision is below tolerable misstatement","Increase tolerable misstatement and accept"],a:1,e:"The decision rule compares the upper limit to tolerable misstatement. Comparing only projected misstatement ignores sampling risk."}
],ref:"AICPA Audit Sampling Guide (MUS)"},

{a:2,title:"Internal Control: COSO Principles and Deficiency Indicators",
instr:"<p>Your understanding of <b>Penrose Logistics, Inc.</b>, a nonissuer, is summarized in the exhibit. For items 1–8, select the COSO 2013 principle that is <b>most directly not present or functioning</b>. For item 9, select the best classification under AU-C 265.</p>",
exhibits:[{title:"Walkthrough & Inquiry Notes",html:"<ol><li>The CEO waived the code of conduct for the VP of Sales after he accepted undisclosed payments from a supplier. No discipline was imposed.</li><li>The “audit committee” consists of the CFO and the CEO's brother-in-law. It meets once a year and does not review financial reporting.</li><li>The accounting staff have no training on ASC 842. Lease accounting was done incorrectly all year.</li><li>Penrose acquired a subsidiary in Mexico in Q2. No one assessed the new risks from foreign currency, local tax, or a new ERP instance.</li><li>Management never considered how sales staff, paid on gross shipments, might manipulate revenue cutoff.</li><li>Programmers can migrate code directly to production without testing or approval.</li><li>Internal audit found a broken reconciliation control in February but did not report it to the controller until October.</li><li>Management's monthly margin review uses spreadsheet data that has never been reconciled to the general ledger.</li></ol>"}],
lists:{cp:["P1: Demonstrates commitment to integrity and ethical values","P2: Board exercises oversight and demonstrates independence","P4: Demonstrates commitment to competence","P8: Assesses fraud risk","P9: Identifies and analyzes significant change","P11: Selects and develops general controls over technology","P13: Uses relevant, quality information","P17: Evaluates and communicates deficiencies"]},
rows:[
{p:"Note 1",list:"cp",a:0,e:"Waiving the code of conduct for misconduct undermines integrity and ethical values (and accountability)."},
{p:"Note 2",list:"cp",a:1,e:"A board or committee that lacks independence and does not oversee reporting fails Principle 2."},
{p:"Note 3",list:"cp",a:2,e:"Lack of competence in a required standard fails Principle 4."},
{p:"Note 4",list:"cp",a:4,e:"Not assessing the risks from an acquisition and a new system fails Principle 9 (significant change)."},
{p:"Note 5",list:"cp",a:3,e:"Not considering incentives to manipulate revenue fails Principle 8 (fraud risk)."},
{p:"Note 6",list:"cp",a:5,e:"Uncontrolled program changes are a technology general control failure (Principle 11)."},
{p:"Note 7",list:"cp",a:7,e:"An eight-month delay in reporting a known deficiency fails Principle 17."},
{p:"Note 8",list:"cp",a:6,e:"A review that relies on unvalidated data fails Principle 13 (relevant, quality information)."},
{p:"Note 2: classification under AU-C 265",o:["Not a deficiency","A deficiency that is neither a significant deficiency nor a material weakness","An indicator of a material weakness (ineffective oversight of financial reporting and internal control by those charged with governance)","Cannot be evaluated without a misstatement"],a:2,e:"AU-C 265 lists ineffective oversight by TCWG as an indicator of a material weakness. Severity does not depend on whether a misstatement actually occurred."}
],ref:"COSO 2013; AU-C 265"},

{a:3,title:"Audit Data Analytics: Journal Entry Testing",
instr:"<p>As part of the required response to management override (AU-C 240), you ran an ADA over the journal entry population for <b>Halbrook Distribution</b> (year-end December 31, 20X6; the December books closed <b>January 8, 20X7</b>). The extract below contains the 14 manual entries posted to the <b>December</b> period. Apply these criteria:</p><ul><li><b>C1</b>: Posted on a Saturday or Sunday</li><li><b>C2</b>: Posted by a user who is <b>not</b> an authorized poster (authorized: MLEE, JCHEN, RPATEL)</li><li><b>C3</b>: Round amount: a multiple of $1,000 <b>and</b> at least $50,000</li><li><b>C4</b>: Posted to December after the January 8 close</li><li><b>C5</b>: Unusual account pairing: a credit to Revenue with a debit to an account other than Accounts receivable or Cash, <b>or</b> any credit to Cost of goods sold</li></ul>",
exhibits:[{title:"Journal Entry Extract",html:"<table><tr><th>JE</th><th>Posted</th><th>Day</th><th>User</th><th>Debit account</th><th>Credit account</th><th class='num'>Amount</th></tr><tr><td>1</td><td>Dec 27</td><td>Sat</td><td>MLEE</td><td>Rent expense</td><td>Accounts payable</td><td class='num'>12,450</td></tr><tr><td>2</td><td>Dec 29</td><td>Mon</td><td>JCHEN</td><td>Accounts receivable</td><td>Revenue</td><td class='num'>50,000</td></tr><tr><td>3</td><td>Dec 30</td><td>Tue</td><td>TOWENS</td><td>Supplies expense</td><td>Cash</td><td class='num'>8,320</td></tr><tr><td>4</td><td>Dec 31</td><td>Wed</td><td>RPATEL</td><td>Accrued liabilities</td><td>Revenue</td><td class='num'>250,000</td></tr><tr><td>5</td><td>Jan 10</td><td>Sat</td><td>RPATEL</td><td>Inventory</td><td>Cost of goods sold</td><td class='num'>75,000</td></tr><tr><td>6</td><td>Dec 15</td><td>Mon</td><td>MLEE</td><td>Utilities expense</td><td>Accounts payable</td><td class='num'>3,118</td></tr><tr><td>7</td><td>Dec 20</td><td>Sat</td><td>JCHEN</td><td>Office expense</td><td>Cash</td><td class='num'>1,975</td></tr><tr><td>8</td><td>Dec 31</td><td>Wed</td><td>KSMITH</td><td>Prepaid expenses</td><td>Professional fees expense</td><td class='num'>100,000</td></tr><tr><td>9</td><td>Jan 12</td><td>Mon</td><td>MLEE</td><td>Accrued expenses</td><td>Cash</td><td class='num'>18,640</td></tr><tr><td>10</td><td>Dec 22</td><td>Mon</td><td>JCHEN</td><td>Equipment</td><td>Accounts payable</td><td class='num'>64,212</td></tr><tr><td>11</td><td>Dec 31</td><td>Wed</td><td>MLEE</td><td>Accounts receivable</td><td>Revenue</td><td class='num'>20,000</td></tr><tr><td>12</td><td>Dec 28</td><td>Sun</td><td>TOWENS</td><td>Accounts receivable</td><td>Revenue</td><td class='num'>90,000</td></tr><tr><td>13</td><td>Dec 18</td><td>Thu</td><td>RPATEL</td><td>Payroll expense</td><td>Accrued payroll</td><td class='num'>5,560</td></tr><tr><td>14</td><td>Jan 9</td><td>Fri</td><td>JCHEN</td><td>Revenue</td><td>Deferred revenue</td><td class='num'>42,800</td></tr></table>"}],
rows:[
{p:"Number of entries meeting C1 (weekend)",type:"num",a:4,tol:0,fmt:"4",e:"JEs 1, 5, 7, 12."},
{p:"Number of entries meeting C2 (unauthorized user)",type:"num",a:3,tol:0,fmt:"3",e:"JEs 3 and 12 (TOWENS) and 8 (KSMITH)."},
{p:"Number of entries meeting C3 (round ≥ $50,000)",type:"num",a:5,tol:0,fmt:"5",e:"JEs 2 (50,000), 4, 5, 8, 12. JE 11 is round but below $50,000. JE 10 is not round."},
{p:"Number of entries meeting C4 (post-close)",type:"num",a:3,tol:0,fmt:"3",e:"JEs 5 (Jan 10), 9 (Jan 12), 14 (Jan 9)."},
{p:"Number of entries meeting TWO OR MORE criteria",type:"num",a:4,tol:0,fmt:"4",e:"JE 4 (C3, C5); JE 5 (C1, C3, C4, C5); JE 8 (C2, C3); JE 12 (C1, C2, C3). JE 14 debits Revenue, so it does not meet C5 and meets only C4."},
{p:"Total dollar amount of entries meeting two or more criteria",type:"num",a:515000,tol:0,fmt:"515,000",e:"250,000 + 75,000 + 100,000 + 90,000 = $515,000."},
{p:"Which entry meets the MOST criteria?",o:["JE 4","JE 5","JE 8","JE 12"],a:1,e:"JE 5 meets four: weekend, round, post-close, and credit to COGS."},
{p:"What should the auditor have done BEFORE running the criteria?",o:["Obtain management's approval of the criteria","Test the completeness and integrity of the JE population, for example by reconciling total JE activity to the change in trial balance accounts","Exclude entries below performance materiality","Notify the users who posted entries"],a:1,e:"The ADA is only as good as the population. Completeness must be established first (AU-C 240, AU-C 500.09)."},
{p:"Appropriate follow-up for the flagged entries",o:["Propose adjustments to reverse all flagged entries","Inquire of the individuals involved, examine supporting documentation, evaluate the business rationale and authorization, and consider whether results indicate fraud or control deficiencies","Accept them if the controller says they are valid","Ignore entries below $100,000"],a:1,e:"Flags are not misstatements per se. AU-C 240 requires testing the appropriateness of selected entries, with skepticism."}
],ref:"AU-C 240.32; AICPA Guide to Audit Data Analytics"},

{a:3,title:"Audit Data Analytics: Accounts Payable Disbursements",
instr:"<p>You ran ADAs on November disbursements of <b>Tremont Foods</b>. Company policy requires a purchase order (PO) and a receiving report (RR) for every inventory purchase (a three-way match), and <b>controller approval for any purchase of $10,000 or more</b>. Answer the items using the extract. Enter whole dollars.</p>",
exhibits:[{title:"Disbursement Extract",html:"<table><tr><th>Pmt</th><th>Vendor</th><th>Invoice #</th><th>Inv. date</th><th class='num'>Amount</th><th>PO</th><th>RR</th></tr><tr><td>P1</td><td>Acme Packaging</td><td>INV-1001</td><td>11/03</td><td class='num'>12,400</td><td>501</td><td>801</td></tr><tr><td>P2</td><td>Acme Packaging</td><td>INV1001</td><td>11/03</td><td class='num'>12,400</td><td>501</td><td>801</td></tr><tr><td>P3</td><td>Brite Supply</td><td>7734</td><td>11/05</td><td class='num'>3,150</td><td>502</td><td>802</td></tr><tr><td>P4</td><td>Brite Supply</td><td>7735</td><td>11/05</td><td class='num'>3,150</td><td>503</td><td>803</td></tr><tr><td>P5</td><td>Cole Farms</td><td>5521</td><td>11/09</td><td class='num'>48,900</td><td>504</td><td>—</td></tr><tr><td>P6</td><td>Dyna Freight</td><td>9001</td><td>11/12</td><td class='num'>7,700</td><td>—</td><td>806</td></tr><tr><td>P7</td><td>Evers Produce</td><td>A-220</td><td>11/15</td><td class='num'>22,000</td><td>507</td><td>807</td></tr><tr><td>P8</td><td>Evers Produce</td><td>A-220</td><td>11/15</td><td class='num'>22,000</td><td>507</td><td>807</td></tr><tr><td>P9</td><td>Fenn Equipment</td><td>3310</td><td>11/20</td><td class='num'>9,999</td><td>509</td><td>809</td></tr><tr><td>P10</td><td>Fenn Equipment</td><td>3311</td><td>11/20</td><td class='num'>9,999</td><td>510</td><td>810</td></tr></table><p>Your initial exact-match duplicate test (same vendor + same invoice # + same amount) flagged only P7/P8.</p>"}],
rows:[
{p:"Number of duplicate payments (count only the second payment of each duplicate pair)",type:"num",a:2,tol:0,fmt:"2",e:"P2 duplicates P1 (same vendor, date, amount, PO, and RR; the invoice number differs only by a hyphen), and P8 duplicates P7."},
{p:"Total amount of duplicate payments",type:"num",a:34400,tol:0,fmt:"34,400",e:"12,400 (P2) + 22,000 (P8) = $34,400."},
{p:"Why did the initial exact-match test miss P1/P2?",o:["The amounts differ","The invoice numbers differ only in formatting, so fuzzy matching or normalizing invoice numbers (for example, removing punctuation) is needed","P2 was paid in a different month","The vendor names differ"],a:1,e:"Exact matching misses formatting variants, a common way duplicates bypass system controls. Refining the ADA criteria is part of the iterative ADA process."},
{p:"P3 and P4 (same vendor, date, and amount)",o:["Duplicate payment","Not a duplicate: different invoice numbers, POs, and RRs support two separate purchases (corroborate if needed)","Split purchase","Three-way match exception"],a:1,e:"Matching amount and date alone do not establish a duplicate when separate POs and RRs exist."},
{p:"Number of three-way match exceptions",type:"num",a:2,tol:0,fmt:"2",e:"P5 (no receiving report) and P6 (no purchase order)."},
{p:"Total amount of three-way match exceptions",type:"num",a:56600,tol:0,fmt:"56,600",e:"48,900 + 7,700 = $56,600."},
{p:"P9 and P10 most likely indicate:",o:["Duplicate payments","Purchases split to stay below the $10,000 approval threshold (circumventing the authorization control)","Proper control operation","A cutoff error"],a:1,e:"Two $9,999 purchases from the same vendor on the same day, just under the threshold, are a classic split-purchase red flag. Investigate authorization and business need."},
{p:"Most appropriate next step for P5",o:["Propose an adjustment to reverse the payment","Obtain evidence of receipt (for example, inventory records, vendor shipping documents, inquiry of receiving) and evaluate why the system allowed payment without a receiving report","Ignore it because it is below materiality","Confirm the payment with the bank"],a:1,e:"An exception requires investigation of both the transaction (were goods received?) and the control failure (why did the match not block payment?)."}
],ref:"AICPA Guide to Audit Data Analytics; AU-C 330"},

{a:4,title:"Evaluating and Communicating Control Deficiencies",
instr:"<p>You are completing the audit of <b>Lindqvist Manufacturing</b>, a nonissuer. For items 1–6, classify each matter under AU-C 265. For items 7–10, select the correct communication requirement.</p>",
exhibits:[{title:"Matters Identified",html:"<ol><li>The auditor's substantive testing identified a material misstatement of inventory that the company's controls failed to detect.</li><li>During the year, the company restated its previously issued financial statements to correct a material misstatement due to error.</li><li>The auditor identified a $9,000 fraud perpetrated by the CFO.</li><li>The board does not oversee financial reporting or internal control.</li><li>A $500 petty cash fund reconciliation was not reviewed one month; no misstatement exists, and the possibility of material misstatement is remote.</li><li>The auditor tested the bank reconciliation control and found it properly designed and operating, with no deviations.</li></ol>"}],
lists:{sv:["Not a deficiency","Deficiency only (not a significant deficiency or material weakness)","Indicator of a material weakness"]},
rows:[
{p:"Matter 1",list:"sv",a:2,e:"An auditor-identified material misstatement not detected by controls is an AU-C 265 indicator of a material weakness."},
{p:"Matter 2",list:"sv",a:2,e:"A restatement of previously issued financial statements to reflect a material misstatement is an indicator."},
{p:"Matter 3",list:"sv",a:2,e:"Fraud by senior management, whether or not material, is an indicator."},
{p:"Matter 4",list:"sv",a:2,e:"Ineffective oversight by those charged with governance is an indicator."},
{p:"Matter 5",list:"sv",a:1,e:"There is a control failure, but only a remote possibility of material misstatement, so it is a deficiency."},
{p:"Matter 6",list:"sv",a:0,e:"A properly designed control operating effectively is not a deficiency."},
{p:"Form and recipients for significant deficiencies and material weaknesses",o:["Orally to management only","In writing to management and those charged with governance","In the auditor's report","In writing to the board only after remediation"],a:1,e:"AU-C 265 requires written communication to management and TCWG."},
{p:"Timing of that written communication",o:["Before the auditor's report is dated, in all cases","No later than 60 days following the report release date (ideally by the report release date)","Within one year","At the next year's planning meeting"],a:1,e:"AU-C 265 sets the 60-day outside limit."},
{p:"Deficiencies that are neither SDs nor MWs but merit management's attention",o:["Must not be communicated","Communicated to management, in writing or orally (oral communications documented)","Communicated only to TCWG in writing","Reported in the auditor's report"],a:1,e:"AU-C 265 allows written or oral communication of these to management."},
{p:"May the auditor's written communication state that no significant deficiencies were identified?",o:["Yes, to reassure management","No; the auditor should not issue a written communication stating that no significant deficiencies were identified","Yes, if management requests it","Only for issuers"],a:1,e:"AU-C 265 prohibits such a statement because of the potential for misinterpretation of the limited assurance."}
],ref:"AU-C 265"},

{a:4,title:"Document Review: Auditor's Report with Multiple Matters",
instr:"<p>Review the draft auditor's report for <b>Keller Biotech, Inc.</b> (nonissuer) for the year ended December 31, 20X6. Comparative 20X5 statements were audited by a <b>predecessor</b> (unmodified opinion dated February 26, 20X6; report <b>not</b> reissued). Substantial doubt about going concern <b>remains</b> and is adequately disclosed in Note 2. In 20X6 Keller changed its inventory method (justified, applied retrospectively, Note 3). The annual report (other information) was obtained before the report date and contains no inconsistencies. The firm was <b>not</b> engaged to report key audit matters. Select the best text for each item.</p>",
exhibits:[{title:"Draft Report (excerpts)",html:"<p><b>[1]</b> In our opinion, the accompanying financial statements present fairly, in all material respects, the financial position of Keller Biotech, Inc. as of December 31, 20X6 and 20X5…</p><p><b>[2]</b> (Section placed immediately after Basis for Opinion: ________)</p><p><b>[3]</b> Going concern section closing sentence: “Accordingly, we express a qualified opinion.”</p><p><b>[4]</b> Note 3 inventory change: “(not mentioned in report)”</p><p><b>[5]</b> Predecessor: “The 20X5 financial statements were audited by Smith &amp; Co. whose work we relied upon.”</p><p><b>[6]</b> Other information: “(not mentioned in report)”</p><p><b>[7]</b> Auditor's responsibilities section omits the going-concern evaluation bullet.</p><p><b>[8]</b> “Key Audit Matters: Going concern (see Note 2).”</p>"}],
rows:[
{p:"[1] Opinion scope",o:["…as of December 31, 20X6 and 20X5, and the results… for the years then ended","…as of December 31, 20X6, and the results of its operations and its cash flows for the year then ended (the successor opines on 20X6 only)","…for 20X5 only","No opinion paragraph is needed"],a:1,e:"The successor opines only on the period it audited. The predecessor's audit of 20X5 is addressed in an other-matter paragraph."},
{p:"[2] Section immediately following Basis for Opinion (per AICPA illustrative reports)",o:["Emphasis of Matter regarding the change in accounting principle","Substantial Doubt About the Company's Ability to Continue as a Going Concern","Other Matter regarding the predecessor","Responsibilities of Management"],a:1,e:"AU-C 570 illustrations place the going-concern section directly after the Basis for Opinion section."},
{p:"[3] Closing sentence of going-concern section",o:["Accordingly, we express a qualified opinion.","Our opinion is not modified with respect to this matter.","We do not express an opinion.","This matter is a key audit matter."],a:1,e:"Adequately disclosed substantial doubt does not modify the opinion."},
{p:"[4] Treatment of the inventory method change",o:["No mention required because it was properly applied","Emphasis-of-matter paragraph referring to Note 3, stating the opinion is not modified","Qualified opinion for inconsistency","Other-matter paragraph"],a:1,e:"AU-C 708 requires an EOM paragraph for a material change in accounting principle."},
{p:"[5] Predecessor paragraph",o:["As drafted","Other-matter paragraph: “The 20X5 financial statements were audited by other auditors, whose report dated February 26, 20X6, expressed an unmodified opinion on those statements.”","Emphasis-of-matter paragraph naming Smith & Co.","Omit any reference"],a:1,e:"AU-C 700 requires an other-matter paragraph. The successor does not state that it relied on the predecessor's work and ordinarily does not name the predecessor."},
{p:"[6] Other information",o:["Not mentioned","Separate “Other Information” section stating that the opinion does not cover the other information and that no opinion or assurance is expressed, and describing the auditor's responsibility to read it","Opinion on the other information","Emphasis-of-matter paragraph"],a:1,e:"AU-C 720 requires the section when other information was obtained before the report date."},
{p:"[7] Going-concern bullet in Auditor's Responsibilities",o:["Correctly omitted because there is a separate going-concern section","Should be included: conclude whether there are conditions or events, considered in the aggregate, that raise substantial doubt about the entity's ability to continue as a going concern for a reasonable period of time","Include only if substantial doubt is alleviated","Replace with a disclaimer"],a:1,e:"The standard AU-C 700 responsibilities section includes this statement in all reports."},
{p:"[8] KAM section",o:["Include going concern as a KAM","Omit the KAM section, because the firm was not engaged to report KAMs; going concern is reported in its own section","Include all significant risks as KAMs","Convert the going-concern section into a KAM"],a:1,e:"AU-C 701 applies only when engaged (or required). Even then, going concern is not described as a KAM."}
],ref:"AU-C 570, 700, 701, 708, 720"}
]});

(window.AUD_DATA = window.AUD_DATA || []).push({"exam":7,"title":"AUD Exam 2: Risk & Evidence Focus","tag":"FOCUS","mcq":[{"a":1,"q":"Which of the following nonattest services performed for a nonpublic audit client would impair independence even if all of the general requirements for performing nonattest services are met?","o":["Preparing depreciation schedules using methods and lives approved by management.","Posting client-coded transactions to the general ledger.","Signing and distributing payroll checks on the client's behalf from the client's bank account.","Proposing standard, adjusting, or correcting journal entries for management's review and approval."],"c":2,"r":["Calculating depreciation with management-approved assumptions is a permitted bookkeeping service if management reviews and accepts responsibility for the results.","Recording transactions that management has coded and approved is permitted bookkeeping.","Correct. Signing checks or having signatory authority over client accounts is accepting responsibility to authorize payment and having custody of client assets. Both are management responsibilities, which impair independence regardless of safeguards (ET 1.295.030).","Proposing entries is permitted provided management reviews, approves, and takes responsibility for them."],"ref":"ET 1.295.030, 1.295.120"},{"a":1,"q":"Under SEC and PCAOB independence rules for audits of issuers, how long may the lead audit partner serve before rotating off, and what is the time-out period?","o":["5 consecutive years; 5-year time-out","7 consecutive years; 2-year time-out","5 consecutive years; 2-year time-out","7 consecutive years; 5-year time-out"],"c":0,"r":["Correct. Under SEC Rule 2-01(c)(6), the lead (engagement) partner and the concurring (engagement quality) reviewer must rotate after 5 consecutive years and then observe a 5-year time-out.","7 years on / 2 years off applies to other audit partners on the engagement team, not the lead or concurring partner.","This mixes the lead-partner service period with the other-partner time-out.","No partner category uses a 7/5 rotation."],"ref":"SEC Reg. S-X Rule 2-01(c)(6); SOX §203"},{"a":1,"q":"An accountant is engaged to compile financial statements for a client in which the accountant's spouse holds a material direct financial interest. Which statement is correct under SSARS?","o":["The accountant may not perform the compilation because independence is required.","The accountant may perform the compilation but must disclose the lack of independence in the compilation report; if the accountant chooses to disclose the reasons, all reasons must be disclosed.","The accountant may perform the compilation and is not permitted to mention independence in the report.","The accountant may perform the compilation only if the financial statements omit substantially all disclosures."],"c":1,"r":["Independence is not required for a compilation. It is required for a review.","Correct. AR-C 80 allows an accountant who is not independent to issue a compilation report, but the report must contain a final paragraph stating the lack of independence. The accountant may describe the reasons, and if so must include all of them.","The lack of independence must be disclosed. Silence is not permitted.","Omitting disclosures has no bearing on the independence disclosure requirement."],"ref":"AR-C 80.22"},{"a":2,"q":"An auditor does not plan to test the operating effectiveness of controls over inventory valuation. Under AU-C 315 as amended by SAS No. 145, how should the auditor assess control risk for the relevant assertion?","o":["At the level supported by the auditor's evaluation of the design and implementation of controls.","At maximum, so that the assessment of the risk of material misstatement is the same as the assessment of inherent risk.","At low, because the auditor will compensate with extended substantive procedures.","Control risk need not be assessed when no tests of controls are planned."],"c":1,"r":["Evaluating design and implementation is not sufficient evidence of operating effectiveness and cannot reduce assessed control risk.","Correct. SAS 145 requires separate assessments of inherent and control risk. If the auditor does not plan to test the operating effectiveness of controls, control risk is assessed at maximum, and RMM equals the inherent risk assessment.","A low control risk assessment requires evidence from tests of operating effectiveness.","Control risk must still be assessed. When controls are not tested, it is assessed at maximum."],"ref":"AU-C 315.34 (SAS 145)"},{"a":2,"q":"During planning analytical procedures, an auditor notes that accounts receivable turnover declined from 9.1 to 6.3 while net sales and credit terms were essentially unchanged. Which risk is most directly indicated?","o":["Unrecorded sales near year-end (completeness of revenue).","Understatement of the allowance for doubtful accounts or fictitious receivables (valuation or existence).","Overstatement of cost of goods sold.","Misclassification of current debt as long-term."],"c":1,"r":["Unrecorded sales would understate receivables and tend to increase turnover, not decrease it.","Correct. With stable sales and terms, a lower turnover means receivables grew relative to sales. That suggests collectibility problems (allowance possibly understated) or fictitious or inflated receivables.","COGS does not enter the AR turnover calculation.","Debt classification is unrelated to receivable turnover."],"ref":"AU-C 520; AU-C 315 risk assessment analytics"},{"a":2,"q":"The CFO of Petra Corp. receives a bonus equal to 50% of her salary if earnings per share reach analysts' consensus forecasts, which the company has narrowly met in each of the last six quarters. In the fraud triangle, this most directly represents:","o":["An opportunity to commit fraud.","An incentive or pressure to commit fraud.","An attitude or rationalization for committing fraud.","A control deficiency in the control environment."],"c":1,"r":["Opportunity arises from circumstances such as ineffective controls or management's ability to override them.","Correct. Significant compensation tied to achieving aggressive earnings targets is a classic incentive or pressure fraud risk factor (AU-C 240 Appendix A).","Rationalization involves attitudes such as excessive interest in maintaining the stock price through aggressive accounting, or a history of rationalizing inappropriate accounting.","The compensation plan is a fraud risk factor, not necessarily a control deficiency."],"ref":"AU-C 240 Appendix A"},{"a":2,"q":"A service auditor's SOC 1 Type 2 report identifies complementary user entity controls (CUECs). If the user auditor plans to rely on the service organization's controls, the user auditor should:","o":["Ignore the CUECs because the service auditor tested them.","Obtain an understanding of, and test as necessary, the user entity's controls that correspond to the CUECs.","Request that the service auditor perform additional tests of the CUECs at the user entity.","Refer to the service auditor in the user auditor's report to share responsibility."],"c":1,"r":["CUECs are controls the service organization assumes the user entity has in place. The service auditor does not test them.","Correct. The service organization's controls are effective only if the user entity's complementary controls are suitably designed and operating. The user auditor must evaluate and, when relying, test those user-entity controls.","The service auditor's engagement is with the service organization, and CUECs operate at the user entity.","The user auditor must not refer to the service auditor in an unmodified opinion."],"ref":"AU-C 402"},{"a":2,"q":"The auditor identifies a significant related party transaction outside the entity's normal course of business: a sale of land to the CEO's brother-in-law at a price 30% above appraised value. How should the auditor treat this transaction under AU-C 550?","o":["As a routine transaction requiring no further consideration if properly disclosed.","As giving rise to a significant risk.","As a scope limitation requiring a qualified opinion.","As a matter to be communicated only if it exceeds performance materiality."],"c":1,"r":["Disclosure is necessary but does not reduce the risk assessment for such transactions.","Correct. AU-C 550 requires the auditor to treat identified significant related party transactions outside the normal course of business as giving rise to significant risks, which calls for specific procedures such as inspecting contracts and evaluating business rationale.","The transaction is not a scope limitation unless the auditor cannot obtain sufficient evidence.","Significant related party matters are communicated to those charged with governance regardless of such a threshold."],"ref":"AU-C 550.19"},{"a":2,"q":"AU-C 240 requires a discussion among key engagement team members about the susceptibility of the financial statements to material misstatement due to fraud. Which statement about this discussion is correct?","o":["It should be held only if fraud risk factors have been identified.","It should include how management could perpetrate and conceal fraudulent financial reporting and how assets could be misappropriated, setting aside beliefs that management is honest.","It should be delegated to the most junior staff, who are least biased.","It replaces the need for inquiries of management about fraud."],"c":1,"r":["The discussion is required on every audit, not only when risk factors exist.","Correct. The discussion should include brainstorming on how and where the financial statements might be susceptible to fraud, how management could perpetrate and conceal it, and the need to maintain skepticism, setting aside prior beliefs about management's honesty.","Key engagement team members, including the engagement partner, should participate.","Inquiries of management, those charged with governance, and others are separately required."],"ref":"AU-C 240.15"},{"a":2,"q":"An auditor engages an outside actuary as an auditor's specialist to evaluate pension obligations. Which of the following is NOT required by AU-C 620?","o":["Evaluating whether the specialist has the necessary competence, capabilities, and objectivity.","Agreeing with the specialist on the nature, scope, and objectives of the specialist's work.","Evaluating the adequacy of the specialist's work for the auditor's purposes.","Referring to the specialist in the unmodified auditor's report to indicate a division of responsibility."],"c":3,"r":["AU-C 620 requires evaluating the specialist's competence, capabilities, and objectivity.","Agreement on nature, scope, objectives, roles, and the nature of communications is required.","The auditor must evaluate the relevance and reasonableness of the specialist's findings, assumptions, and methods.","Correct. The auditor should not refer to the work of an auditor's specialist in an unmodified opinion. A reference is permitted only when relevant to understanding a modification, and then must state that it does not reduce the auditor's responsibility."],"ref":"AU-C 620.09–.15"},{"a":3,"q":"To test the completeness of recorded sales, an auditor would most likely:","o":["Vouch entries in the sales journal to shipping documents.","Trace a sample of prenumbered shipping documents to entries in the sales journal.","Confirm customer balances using positive confirmations.","Recompute the allowance for doubtful accounts."],"c":1,"r":["Vouching from the journal tests occurrence, not completeness.","Correct. Starting from a population that should be fully recorded (prenumbered shipping documents) and tracing it into the accounting records detects unrecorded sales.","Confirmations mainly address existence. Customers rarely report understatements of what they owe.","Recomputing the allowance addresses valuation."],"ref":"AU-C 500"},{"a":3,"q":"During an inventory observation, the auditor selects items from the client's count sheets and physically locates and counts them in the warehouse. This test primarily addresses which assertion?","o":["Completeness","Existence","Rights and obligations","Valuation"],"c":1,"r":["Completeness is tested by selecting items on the floor and tracing them to the count sheets.","Correct. Starting with recorded quantities and verifying the items physically exist tests existence, guarding against overstatement.","Observation does not establish ownership. Consigned goods could be on hand.","Physical counts do not establish cost or net realizable value."],"ref":"AU-C 501.04"},{"a":3,"q":"Management sends a letter of inquiry to the company's outside legal counsel. Counsel refuses to furnish the information requested about a significant pending lawsuit. The auditor should most likely:","o":["Issue an unmodified opinion with an emphasis-of-matter paragraph.","Treat the refusal as a limitation on the scope of the audit, which ordinarily results in a qualified opinion or disclaimer of opinion.","Rely on management's representation regarding the lawsuit.","Consult directly with the opposing party's attorney."],"c":1,"r":["An emphasis-of-matter paragraph does not address a lack of evidence.","Correct. Under AU-C 501, a lawyer's refusal to respond, or management's refusal to permit communication, is a scope limitation. If sufficient evidence cannot be obtained otherwise, the auditor qualifies or disclaims.","Management's representation is not sufficient to replace the lawyer's corroboration.","Contacting opposing counsel is not appropriate and would not be reliable."],"ref":"AU-C 501.24–.25"},{"a":3,"q":"In an attributes sampling plan for tests of controls, which of the following changes would increase the required sample size, holding all else constant?","o":["An increase in the tolerable rate of deviation.","A decrease in the expected population deviation rate.","A decrease in the acceptable risk of assessing control risk too low (overreliance).","An increase in population size from 50,000 to 60,000 items."],"c":2,"r":["A higher tolerable rate allows a smaller sample.","A lower expected deviation rate allows a smaller sample.","Correct. Lower acceptable risk of overreliance means higher required confidence, which increases sample size.","For large populations, population size has little or no effect on sample size."],"ref":"AU-C 530; AICPA Audit Sampling Guide"},{"a":3,"q":"Using MUS with a sampling interval of $10,000, an auditor finds that an account with a recorded amount of $2,000 has an audited amount of $1,500. What is the projected misstatement for this item?","o":["$500","$2,000","$2,500","$5,000"],"c":2,"r":["$500 is the actual misstatement, which is the projection only for items equal to or larger than the sampling interval.","$2,000 is the recorded amount.","Correct. Tainting = $500 ÷ $2,000 = 25%. Projected misstatement = 25% × $10,000 interval = $2,500.","$5,000 would assume 50% tainting."],"ref":"AICPA Audit Sampling Guide (MUS)"},{"a":3,"q":"Which procedure would most likely detect payroll payments to fictitious employees?","o":["Recomputing gross pay for a sample of employees.","Comparing names on the payroll register to personnel files with hiring authorizations and, on a surprise basis, observing the distribution of paychecks.","Reviewing payroll tax returns for timely filing.","Comparing total payroll expense to the prior year."],"c":1,"r":["Recomputation tests accuracy, not whether employees exist.","Correct. Matching payees to independently maintained personnel records, and observing a surprise payroll distribution with identification, detects payees with no real employment.","Tax filing reviews address compliance and liability accuracy.","An overall comparison is unlikely to detect a few fictitious employees."],"ref":"Payroll cycle procedures"},{"a":3,"q":"What is the purpose of the auditor's retrospective review of the outcome of prior-period accountin
